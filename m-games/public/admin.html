<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Elon's Math Game</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0d0d2b, #1a1a40, #2d1b69);
      color: white;
      padding: 32px 16px 48px;
    }

    .container { max-width: 820px; margin: 0 auto; }

    h1 { font-size: 28px; font-weight: 800; margin: 0 0 6px; }
    .sub { color: #9399d0; font-size: 14px; margin-bottom: 32px; }

    /* Login card */
    .login-card {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 20px;
      padding: 36px;
      max-width: 360px;
      margin: 80px auto 0;
      text-align: center;
    }
    .login-card h2 { margin: 0 0 8px; font-size: 22px; }
    .login-card p  { color: #9399d0; font-size: 14px; margin: 0 0 24px; }
    .login-card input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 15px;
      outline: none;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }
    .login-card input:focus { border-color: #ffd60a; }
    .login-error { color: #ff6b6b; font-size: 14px; min-height: 20px; margin-bottom: 10px; }

    /* Buttons */
    .btn {
      border: none; border-radius: 12px;
      padding: 13px 22px; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: transform 0.15s, opacity 0.15s;
      width: 100%;
    }
    .btn:hover { transform: translateY(-2px); opacity: 0.92; }
    .btn-primary  { background: #ffd60a; color: #1a1a40; }
    .btn-sm { width: auto; padding: 8px 16px; font-size: 13px; }
    .btn-danger { background: #ff4d6d; color: white; }

    /* Dashboard */
    #dashboard { display: none; }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 14px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 16px;
      padding: 20px;
    }
    .stat-card .label { font-size: 12px; color: #9399d0; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .stat-card .value { font-size: 32px; font-weight: 800; color: #ffd60a; }
    .stat-card .detail { font-size: 12px; color: #9399d0; margin-top: 4px; }

    .section-title { font-size: 18px; font-weight: 700; margin: 0 0 14px; }

    .topic-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 28px;
      font-size: 14px;
    }
    .topic-table th {
      text-align: left;
      padding: 10px 14px;
      background: rgba(255,255,255,0.07);
      color: #9399d0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .topic-table td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .topic-table tr:last-child td { border-bottom: none; }

    .accuracy-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .bar-track {
      flex: 1;
      height: 8px;
      background: rgba(255,255,255,0.12);
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: #80ed99;
      border-radius: 4px;
    }

    .activity-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 320px;
      overflow-y: auto;
    }
    .activity-list li {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .activity-list li:last-child { border-bottom: none; }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge.correct { background: rgba(128,237,153,0.2); color: #80ed99; }
    .badge.wrong   { background: rgba(255,107,107,0.2); color: #ff6b6b; }

    .back-link {
      display: inline-block;
      color: #9399d0;
      font-size: 13px;
      text-decoration: none;
      margin-bottom: 20px;
    }
    .back-link:hover { color: white; }

    .refresh-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .last-refresh { font-size: 12px; color: #9399d0; }
  </style>
</head>
<body>
<div class="container">

  <!-- Login -->
  <div id="login-section">
    <div class="login-card">
      <div style="font-size:40px;margin-bottom:12px">🔐</div>
      <h2>Admin Panel</h2>
      <p>Elon's Math Game</p>
      <input type="password" id="pw-input" placeholder="Password" />
      <div class="login-error" id="login-error"></div>
      <button class="btn btn-primary" id="login-btn">Sign In</button>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard">
    <a href="/" class="back-link">← Back to Game</a>
    <div class="dash-header">
      <div>
        <h1>📊 Admin Panel</h1>
        <div class="sub">Elon's Math Game — live stats (resets on server restart)</div>
      </div>
      <div class="refresh-row">
        <span class="last-refresh" id="last-refresh"></span>
        <button class="btn btn-primary btn-sm" onclick="loadStats()">Refresh</button>
        <button class="btn btn-danger btn-sm" onclick="doLogout()">Logout</button>
      </div>
    </div>

    <!-- Summary cards -->
    <div class="stat-grid">
      <div class="stat-card">
        <div class="label">Total Sessions</div>
        <div class="value" id="s-sessions">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Questions Answered</div>
        <div class="value" id="s-answered">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Overall Accuracy</div>
        <div class="value" id="s-accuracy">—</div>
        <div class="detail" id="s-accuracy-detail"></div>
      </div>
    </div>

    <!-- Per-topic table -->
    <div class="section-title">Performance by Topic</div>
    <table class="topic-table">
      <thead>
        <tr>
          <th>Topic</th>
          <th>Answered</th>
          <th>Correct</th>
          <th>Accuracy</th>
        </tr>
      </thead>
      <tbody id="topic-tbody"></tbody>
    </table>

    <!-- Recent activity -->
    <div class="section-title">Recent Activity (last 100)</div>
    <ul class="activity-list" id="activity-list"></ul>
  </div>

</div>

<script>
let adminPassword = '';

function fmt(topic) {
  return { addition: 'Long Addition', multiplication: '2-Digit Multiplication', division: '3-Digit Division' }[topic] || topic;
}

function pct(correct, answered) {
  if (!answered) return '—';
  return Math.round((correct / answered) * 100) + '%';
}

async function doLogin() {
  const pw  = document.getElementById('pw-input').value;
  const err = document.getElementById('login-error');
  err.textContent = '';

  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    });
    if (!res.ok) { err.textContent = 'Wrong password.'; return; }
    adminPassword = pw;
    document.getElementById('login-section').style.display = 'none';
    document.getElementById('dashboard').style.display     = 'block';
    loadStats();
  } catch {
    err.textContent = 'Could not reach server.';
  }
}

async function loadStats() {
  try {
    const res  = await fetch(`/api/admin/stats?password=${encodeURIComponent(adminPassword)}`);
    if (!res.ok) { doLogout(); return; }
    const data = await res.json();
    renderStats(data);
    document.getElementById('last-refresh').textContent =
      'Updated ' + new Date().toLocaleTimeString();
  } catch {
    document.getElementById('last-refresh').textContent = 'Error loading stats';
  }
}

function renderStats(d) {
  document.getElementById('s-sessions').textContent  = d.totalSessions;
  document.getElementById('s-answered').textContent  = d.questionsAnswered;

  const acc = pct(d.correctAnswers, d.questionsAnswered);
  document.getElementById('s-accuracy').textContent        = acc;
  document.getElementById('s-accuracy-detail').textContent =
    d.questionsAnswered ? `${d.correctAnswers} correct of ${d.questionsAnswered}` : '';

  // Topic table
  const tbody = document.getElementById('topic-tbody');
  tbody.innerHTML = Object.entries(d.topicStats).map(([topic, ts]) => {
    const p = ts.answered ? Math.round((ts.correct / ts.answered) * 100) : 0;
    return `
      <tr>
        <td>${fmt(topic)}</td>
        <td>${ts.answered}</td>
        <td>${ts.correct}</td>
        <td>
          <div class="accuracy-bar">
            <div class="bar-track"><div class="bar-fill" style="width:${p}%"></div></div>
            <span>${ts.answered ? p + '%' : '—'}</span>
          </div>
        </td>
      </tr>`;
  }).join('');

  // Activity
  const list = document.getElementById('activity-list');
  if (!d.recentActivity.length) {
    list.innerHTML = '<li style="color:#9399d0">No activity yet.</li>';
    return;
  }
  list.innerHTML = d.recentActivity.map(a => `
    <li>
      <span>${fmt(a.topic)} — ${new Date(a.time).toLocaleTimeString()}</span>
      <span class="badge ${a.correct ? 'correct' : 'wrong'}">${a.correct ? 'Correct' : 'Wrong'}</span>
    </li>`).join('');
}

function doLogout() {
  adminPassword = '';
  document.getElementById('login-section').style.display = 'block';
  document.getElementById('dashboard').style.display     = 'none';
  document.getElementById('pw-input').value = '';
}

document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('pw-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
