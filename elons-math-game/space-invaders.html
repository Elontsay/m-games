  // tridents -- huge, straight, and electrified in phase 2
  for (const t of tridents) {
    const hot = boss && boss.kind === "shark" && boss.phase === 2;
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(t.ang + Math.PI / 2);
    ctx.shadowColor = hot ? "#9fe8ff" : "#8fa8c8";
    ctx.shadowBlur = hot ? 20 : 10;
    ctx.fillStyle = hot ? "#cdf2ff" : "#c3d2e0";
    ctx.fillRect(-4, -6, 8, 62);                              // shaft
    ctx.fillRect(-22, -10, 44, 8);                            // crossbar
    for (const px of [-18, 0, 18]) {                          // three prongs
      ctx.beginPath();
      ctx.moveTo(px, -44); ctx.lineTo(px + 7, -8); ctx.lineTo(px - 7, -8);
      ctx.closePath(); ctx.fill();
    }
    if (hot) {
      ctx.globalAlpha = 0.5 + Math.random() * 0.5;
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-14, -30);
      ctx.lineTo(-4 + Math.random() * 8, -16);
      ctx.lineTo(14, -34 + Math.random() * 10);
      ctx.stroke();
    }
    ctx.restore();
  }

  // water orbs
  for (const o of orbs) {
    ctx.save();
    ctx.shadowColor = "#4fb8ff"; ctx.shadowBlur = 16;
    const g = ctx.createRadialGradient(o.x - 3, o.y - 4, 2, o.x, o.y, o.r);
    g.addColorStop(0, "rgba(230,250,255,.95)");
    g.addColorStop(0.5, "rgba(90,190,255,.85)");
    g.addColorStop(1, "rgba(20,90,180,.35)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(200,240,255,.7)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // boosters left behind by specials
  for (const b of boosters) {
    const isRapid = b.kind === "rapid";
    const bob = Math.sin(b.t * 6) * 2;
    ctx.save();
    ctx.shadowColor = isRapid ? "#ffe14d" : "#ff9a5a"; ctx.shadowBlur = 16;
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = isRapid ? "#ffe14d" : "#ff9a5a";
    ctx.fillRect(b.x - 11, b.y - 9 + bob, 22, 18);
    ctx.fillStyle = "#101425";
    ctx.fillRect(b.x - 8, b.y - 6 + bob, 16, 12);
    ctx.fillStyle = isRapid ? "#fff6c2" : "#ffd9a0";
    ctx.font = "bold 12px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.fillText(isRapid ? "R" : "G", b.x, b.y + 4 + bob);
    ctx.restore();
  }

  for (const g of grenades) {
    ctx.save();
    ctx.shadowColor = "#ff5a2e"; ctx.shadowBlur = 10;
    ctx.fillStyle = "#3b2b2b";
    ctx.beginPath(); ctx.arc(g.x, g.y, 7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#8a6a4a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(g.x, g.y, 7, 0, Math.PI * 2); ctx.stroke();
    const blink = g.fuse < 0.6 ? (Math.floor(g.fuse * 14) % 2) : 1;
    if (blink) {
      ctx.fillStyle = "#ffd36b";
      ctx.fillRect(g.x - 1.5 + Math.cos(g.spin) * 5, g.y - 9 + Math.sin(g.spin) * 2, 3, 3);
    }
    ctx.restore();
  }

  for (const b of blasts) {
    const a = 1 - b.t / b.life;
    ctx.save();
    ctx.globalAlpha = a * 0.75;
    const g = ctx.createRadialGradient(b.x, b.y, b.r * 0.15, b.x, b.y, b.r);
    if (b.electric) {
      g.addColorStop(0, "rgba(255,255,255,.95)");
      g.addColorStop(0.4, "rgba(120,215,255,.7)");
      g.addColorStop(1, "rgba(40,120,255,0)");
    } else {
      g.addColorStop(0, "rgba(255,255,220,.95)");
      g.addColorStop(0.4, "rgba(255,150,40,.7)");
      g.addColorStop(1, "rgba(255,60,0,0)");
    }
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = a;
    ctx.strokeStyle = b.electric ? "rgba(190,240,255,.9)" : "rgba(255,220,150,.8)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
    if (b.electric) {                       // jagged arcs off the blast front
      ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 2;
      for (let s = 0; s < 7; s++) {
        const ang = (s / 7) * Math.PI * 2 + b.t * 4;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        for (let seg = 1; seg <= 3; seg++) {
          const rr = b.r * (seg / 3);
          const jitter = (Math.random() - 0.5) * 0.5;
          ctx.lineTo(b.x + Math.cos(ang + jitter) * rr, b.y + Math.sin(ang + jitter) * rr);
        }
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  if (player.alive && (player.inv <= 0 || Math.floor(player.inv * 12) % 2 === 0)) {
    if (admin.immortal) {
      ctx.save();
      ctx.globalAlpha = 0.35 + Math.sin(performance.now() / 200) * 0.15;
      ctx.strokeStyle = "#66ffd5"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(player.x, player.y, 28, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    const underwater = boss && boss.kind === "shark" && player.y > WATER_Y;
    ctx.save();
    if (underwater) {
      // sitting under the surface: dimmed, tinted, trailing bubbles
      ctx.globalAlpha = 0.92;
      ctx.shadowColor = "#6ff0ff"; ctx.shadowBlur = 18;
      drawSprite(SPR.player[0], "#9ffce4", 3, player.x, player.y);
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = "#bfe8ff";
      for (let i = 0; i < 3; i++) {
        const t = performance.now() / 600 + i * 1.7;
        const bx = player.x + Math.sin(t * 2.2 + i) * 10;
        const by = player.y - 6 - ((t * 24) % 34);
        ctx.beginPath(); ctx.arc(bx, by, 1.6 + (i % 2), 0, Math.PI * 2); ctx.fill();
      }
    } else {
      ctx.shadowColor = "#1f7a4a"; ctx.shadowBlur = 10;
      drawSprite(SPR.player[0], "#7dffb2", 3, player.x, player.y);
    }
    ctx.restore();
  }

  drawHUD();

  // the commander's blackout: kills the lights for a second
  if (blackout > 0) {
    ctx.fillStyle = "#000000";
    ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(60,20,20," + (0.35 + Math.random() * 0.25) + ")";
    ctx.font = "bold 22px 'Courier New', monospace";
    ctx.fillText("BLACKOUT", W / 2, H / 2);
  }

  if (state === "admin") drawAdmin();
  else if (state === "paused") panel("PAUSED", [{ text: "" }], "PRESS P TO RESUME");
  else if (state === "wavedone")
    panel("WAVE " + wave + " CLEARED", [
      { text: "score " + score, color: "#ffe14d" },
      { text: "" },
      { text: isBossWave(wave + 1) ? "the void sweeper is waiting" : "the next wave descends lower and faster",
        color: isBossWave(wave + 1) ? "#c58bff" : "#9fc4ea" }
    ], "PRESS SPACE FOR WAVE " + (wave + 1));
  else if (state === "over")
    panel("GAME OVER", [
      { text: "final score  " + score, color: "#ffe14d" },
      { text: "best  " + hiScore },
      { text: "" },
      { text: "you reached wave " + wave }
    ], "PRESS SPACE TO PLAY AGAIN");

  ctx.restore();
}

/* ------------------------------------------------------------------ *
 *  Loop                                                              *
 * ------------------------------------------------------------------ */

let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
