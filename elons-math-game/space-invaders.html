const spriteCache = new Map();
function sprite(rows, color, scale) {
  const key = rows[0] + "|" + rows.length + "|" + color + "|" + scale;
  let c = spriteCache.get(key);
  if (c) return c;
  const w = rows[0].length, h = rows.length;
  c = document.createElement("canvas");
  c.width = w * scale; c.height = h * scale;
  const g = c.getContext("2d");
  g.fillStyle = color;
  for (let r = 0; r < h; r++)
    for (let x = 0; x < w; x++)
      if (rows[r][x] === "X") g.fillRect(x * scale, r * scale, scale, scale);
  spriteCache.set(key, c);
  return c;
}
function drawSprite(rows, color, scale, cx, cy) {
  const c = sprite(rows, color, scale);
  ctx.drawImage(c, Math.round(cx - c.width / 2), Math.round(cy - c.height / 2));
}

/* ------------------------------------------------------------------ *
 *  Alien types                                                       *
 * ------------------------------------------------------------------ */

const TYPES = {
  blue:   { spr: SPR.blue,   color: "#4fa8ff", hot: "#b7dcff", glow: "#1b4d8f", hp: 1, points: 10, w: 33, h: 24,
            fireMin: 3.4, fireMax: 7.0, shot: "normal",   desc: "standard shot" },
  orange: { spr: SPR.orange, color: "#ff9a2e", hot: "#ffd9a0", glow: "#8a4a05", hp: 1, points: 20, w: 36, h: 24,

  red:    { spr: SPR.red,    color: "#ff4a52", hot: "#ffb0b4", glow: "#8c1620", hp: 2, points: 30, w: 36, h: 24,
            fireMin: 3.0, fireMax: 6.4, shot: "heavy",    desc: "armoured - 2 hits" },
  yellow: { spr: SPR.yellow, color: "#ffe14d", hot: "#fff6c2", glow: "#8a7300", hp: 1, points: 40, w: 33, h: 24,
            fireMin: 2.6, fireMax: 5.2, shot: "rapid",    desc: "rapid fire" }
};

const WAVE_ROWS = [
  ["yellow", "red",    "orange", "blue",   "blue"],
  ["yellow", "red",    "orange", "orange", "blue"],
  ["yellow", "yellow", "red",    "orange", "blue"],
  ["red",    "yellow", "red",    "orange", "orange"],
  ["yellow", "red",    "yellow", "red",    "orange"]
];

const isBossWave = w => w % 5 === 0;
const BOSS_ORDER = ["void", "shark", "baseball", "airforce"];   // waves 5,10,15,20 then repeat
const bossKind  = w => BOSS_ORDER[(Math.floor(w / 5) - 1 + 400) % 4];
const bossTier  = w => Math.floor((Math.floor(w / 5) - 1) / 4) + 1;
const BOSS_NAME = { void: "VOID SWEEPER", shark: "KNIFE SHARK",
                    baseball: "BASEBALL HUNTER", airforce: "AIR FORCE COMMANDER" };
const TROOP_GROUND = 618;      // where paratroopers land
const MAX_TROOPERS = 15;       // never more than this many on the field
const WATER_Y = 568;           // the shark's waterline, drawn only on its wave

/* ------------------------------------------------------------------ *
 *  State                                                             *
 * ------------------------------------------------------------------ */

let state = "title";           // title | play | paused | admin | wavedone | over
let prevState = "title";       // what the admin panel returns to
let score = 0, wave = 1, lives = 3;
let hiScore = 0;
try { hiScore = parseInt(localStorage.getItem("si_hi") || "0", 10) || 0; } catch (e) {}

const admin = { open: false, sel: 0, targetWave: 1, immortal: false, used: false };

const player = { x: W / 2, y: 596, w: 39, h: 24, speed: 300, cool: 0, inv: 0, alive: true,
                 nades: 0, nadeCool: 0, rapidT: 0 };
let bullets = [], eBullets = [], grenades = [], lasers = [], phantoms = [], boosters = [];
let knives = [], tridents = [], orbs = [], balls = [], walls = [];
let bombers = [], troopers = [], bombs = [], bBullets = [], blackout = 0;
let enemies = [], parts = [], blasts = [], boss = null, beam = null;
let dir = 1, dropPending = 0, stepSnd = 0, waveTimer = 0, shakeT = 0, shakeAmp = 0;

let stars = [];
for (let i = 0; i < 90; i++)
  stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.6 + 0.4, v: Math.random() * 10 + 4 });

/* ------------------------------------------------------------------ *
 *  Input                                                             *
 * ------------------------------------------------------------------ */

const keys = new Set();
const BLOCK = new Set(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", " "]);

addEventListener("keydown", e => {
  if (BLOCK.has(e.code) || BLOCK.has(e.key)) e.preventDefault();
  if (e.repeat) return;
  keys.add(e.code);

  if (e.code === "Backquote" || e.key === "`" || e.key === "~" || e.code === "F1") { toggleAdmin(); return; }
  if (admin.open) { adminKey(e.code); return; }

  if (e.code === "KeyP") {
    if (state === "play") state = "paused";
    else if (state === "paused") state = "play";
  }
  if (e.code === "Space" || e.code === "Enter") {
    if (state === "title" || state === "over") startGame();
    else if (state === "wavedone") nextWave();
  }
});
addEventListener("keyup", e => keys.delete(e.code));
addEventListener("blur", () => keys.clear());

cvs.addEventListener("mousedown", e => {
  const r = cvs.getBoundingClientRect ? cvs.getBoundingClientRect() : { left: 0, top: 0, width: W, height: H };
  const mx = (e.clientX - r.left) * (W / r.width);
  const my = (e.clientY - r.top) * (H / r.height);
  if (admin.open) adminClick(mx, my);
  else if (my > H - 40 && mx > W - 130) toggleAdmin();
});

const left  = () => keys.has("ArrowLeft")  || keys.has("KeyA");
const right = () => keys.has("ArrowRight") || keys.has("KeyD");
const up    = () => keys.has("ArrowUp")    || keys.has("KeyW");
const down  = () => keys.has("ArrowDown")  || keys.has("KeyS");
const fire  = () => keys.has("Space");
const nade  = () => keys.has("KeyF") || keys.has("ShiftLeft") || keys.has("ShiftRight");
const back  = () => keys.has("KeyB");

/* ------------------------------------------------------------------ *
 *  Admin panel                                                       *
 * ------------------------------------------------------------------ */

const ADMIN_ROWS = [
  { label: () => "JUMP TO WAVE   < " + admin.targetWave + (isBossWave(admin.targetWave) ? "  BOSS >" : " >"),
    hint: "left/right to choose, enter to jump", act: () => jumpToWave(admin.targetWave),
    adjust: d => { admin.targetWave = Math.max(1, Math.min(99, admin.targetWave + d)); } },
  { label: () => "IMMORTALITY SHIELD   " + (admin.immortal ? "[ ON ]" : "[ OFF ]"),
    hint: "the ship cannot be destroyed", act: () => { admin.immortal = !admin.immortal; admin.used = true; },
    adjust: () => { admin.immortal = !admin.immortal; admin.used = true; } },
  { label: () => "SPAWN SPECIAL RED",    hint: "rapid burst, drops a booster when killed", act: () => adminSpawnSpecial("red") },
  { label: () => "SPAWN SPECIAL ORANGE", hint: "rapid burst, drops a booster when killed", act: () => adminSpawnSpecial("orange") },
  { label: () => "SPAWN SPECIAL YELLOW", hint: "rapid burst, drops a booster when killed", act: () => adminSpawnSpecial("yellow") },
  { label: () => "GRANT BOOSTERS   grenades " + player.nades + " / rapid " + Math.ceil(player.rapidT) + "s",
    hint: "hand the ship both boosters right now", act: () => adminGrantBoosters() },
  { label: () => "SUMMON VOID SWEEPER",  hint: "drop the wave 5 boss into the current wave", act: () => adminSpawnBoss("void") },
  { label: () => "SUMMON KNIFE SHARK",   hint: "drop the wave 10 boss in - knives, tridents, ambush", act: () => adminSpawnBoss("shark") },
  { label: () => "SUMMON BASEBALL HUNTER", hint: "drop the wave 15 boss in - cascades, trackers, walls", act: () => adminSpawnBoss("baseball") },
  { label: () => "SUMMON AIR FORCE CMDR", hint: "drop the wave 20 boss in - bombers, paratroopers, blackout", act: () => adminSpawnBoss("airforce") },
  { label: () => "CLEAR ALL ENEMIES",    hint: "wipe the field", act: () => adminClear() },
  { label: () => "CLOSE PANEL",          hint: "resume play", act: () => toggleAdmin() }
];

function toggleAdmin() {
  keys.clear();
  if (admin.open) {
    admin.open = false;
    state = (prevState === "admin" ? "play" : prevState);
  } else {
    prevState = state;
    admin.open = true;
    admin.targetWave = wave;
    state = "admin";
  }
}
function adminKey(code) {
  if (code === "Escape") { toggleAdmin(); return; }
  const row = ADMIN_ROWS[admin.sel];
  if (code === "ArrowUp" || code === "KeyW") admin.sel = (admin.sel + ADMIN_ROWS.length - 1) % ADMIN_ROWS.length;
  else if (code === "ArrowDown" || code === "KeyS") admin.sel = (admin.sel + 1) % ADMIN_ROWS.length;
  else if (code === "ArrowLeft" || code === "KeyA") { if (row.adjust) row.adjust(-1); }
  else if (code === "ArrowRight" || code === "KeyD") { if (row.adjust) row.adjust(1); }
  else if (code === "Enter" || code === "Space") { row.act(); }
}
function adminClick(mx, my) {
  for (let i = 0; i < ADMIN_ROWS.length; i++) {
    const y = adminRowY(i);
    if (my > y - 14 && my < y + 11) {
      admin.sel = i;
      const row = ADMIN_ROWS[i];
      if (row.adjust && mx < W / 2 - 40) row.adjust(-1);
      else if (row.adjust && mx > W / 2 + 150) row.adjust(1);
      else row.act();
      return;
    }
  }
}
const adminRowY = i => 186 + i * 32;

function jumpToWave(n) {
  admin.used = true;
  wave = Math.max(1, n);
  if (lives <= 0) lives = 3;
  parts = [];
  spawnWave();
  admin.open = false;
  prevState = "play";
  state = "play";
}
function adminSpawnSpecial(key) {
  admin.used = true;
  enemies.push(makeAlien(key, 90 + Math.random() * (W - 180), 120 + Math.random() * 90, true, true));
}
function adminSpawnBoss(kind) { admin.used = true; if (!boss) spawnBoss(kind); }
function adminGrantBoosters() {
  admin.used = true;
  player.nades = 6;
  player.rapidT = 16;
}
function adminClear() {
  admin.used = true;
  for (const e of enemies) if (e.alive) boom(e.x, e.y, e.type.color, 10, 120, 0.5);
  for (const p of phantoms) boom(p.x, p.y, "#c58bff", 10, 120, 0.5);
  enemies = []; phantoms = []; eBullets = []; grenades = []; lasers = []; boosters = [];
  knives = []; tridents = []; orbs = []; balls = []; walls = []; beam = null;
  bombers = []; troopers = []; bombs = []; bBullets = []; blackout = 0;
  if (boss) { boom(boss.x, boss.y, "#c58bff", 40, 220, 0.9); boss = null; }
}

/* ------------------------------------------------------------------ *
 *  Spawning                                                          *
 * ------------------------------------------------------------------ */

const COLS = 11, ROWS = 5, GAPX = 56, GAPY = 46;

function makeAlien(key, x, y, free, special) {
  const t = TYPES[key];
  return {
    key, type: t, col: 0, row: 0, x, y,
    hp: t.hp + (special ? 1 : 0), frame: 0, flash: 0, alive: true,
    free: !!free, special: !!special, swayT: Math.random() * 6,
    cool: Math.random() * t.fireMax, burst: 0, burstT: 0, burstGap: 0.13
  };
}

function spawnWave() {
  enemies = []; phantoms = []; bullets = []; eBullets = [];
  grenades = []; lasers = []; boosters = []; blasts = []; beam = null; boss = null;
  knives = []; tridents = []; orbs = []; balls = []; walls = [];
  bombers = []; troopers = []; bombs = []; bBullets = []; blackout = 0;
  dir = 1; dropPending = 0; waveTimer = 0;
  player.x = W / 2; player.y = 596; player.inv = 1.2; player.alive = true;

  if (isBossWave(wave)) { spawnBoss(); return; }

  const layout = WAVE_ROWS[Math.min(wave - 1, WAVE_ROWS.length - 1)];
  const startX = (W - (COLS - 1) * GAPX) / 2;
  const startY = 96 + Math.min(wave - 1, 5) * 12;
  for (let r = 0; r < ROWS; r++) {
    let key = layout[r];
    if (wave > WAVE_ROWS.length) {
      const boost = Math.min((wave - WAVE_ROWS.length) * 0.09, 0.55);
      if (key === "blue" && Math.random() < boost) key = "orange";
      if (key === "orange" && Math.random() < boost * 0.7) key = "red";
    }
    for (let c = 0; c < COLS; c++) {
      const e = makeAlien(key, startX + c * GAPX, startY + r * GAPY, false, false);
      e.col = c; e.row = r;
      enemies.push(e);
    }
  }

  // a handful of the R/O/Y ranks are promoted to specials as waves escalate
  const quota = Math.min(1 + Math.floor(wave / 2), 6);
  const pool = enemies.filter(e => e.key !== "blue");
  for (let i = 0; i < quota && pool.length; i++) {
    const e = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
    e.special = true; e.hp = e.type.hp + 1;
  }
}

function spawnBoss(kind) {
  kind = kind || bossKind(wave);
  if (kind === "airforce") {
    const tier = bossTier(wave);
    const hp = 130 + 45 * (tier - 1);
    boss = {
      kind: "airforce", x: W / 2, y: 96, w: 112, h: 48,
      hp, maxHp: hp, tier, phase: 1,
      t: 0, frame: 0, frameT: 0, flash: 0, dead: 0,
      vx: 110 + tier * 12, facing: 1,
      cool: 1.6, mode: null, modeT: 0, shots: 0, shotT: 0
    };
    return;
  }
  if (kind === "baseball") {
    const tier = bossTier(wave);
    const hp = 120 + 45 * (tier - 1);
    boss = {
      kind: "baseball", x: W / 2, y: 128, w: 96, h: 56,
      hp, maxHp: hp, tier, phase: 1,
      t: 0, frame: 0, frameT: 0, flash: 0, dead: 0,
      vx: 85 + tier * 10, cool: 1.8,
      mode: null, modeT: 0, shots: 0, shotT: 0, swing: 0
    };
    return;
  }
  if (kind === "shark") {
    const tier = Math.max(1, Math.floor(wave / 10));
    const hp = 90 + 40 * tier;
    boss = {
      kind: "shark", x: W / 2, y: 150, w: 112, h: 56,
      hp, maxHp: hp, tier, phase: 1,
      t: 0, frame: 0, frameT: 0, flash: 0, dead: 0,
      vx: 70 + tier * 10, facing: 1,
      cool: 2.0, mode: null, modeT: 0, shots: 0, shotT: 0,
      sub: false, subT: 0, finX: W / 2, ambush: null, homeY: 150
    };
    return;
  }
  const tier = Math.max(1, Math.floor(wave / 5));
  boss = {
    kind: "void", x: W / 2, y: 130, w: 96, h: 48,
    hp: 55 + 25 * tier, maxHp: 55 + 25 * tier,
    t: 0, frame: 0, frameT: 0, flash: 0,
    vx: 60 + tier * 8, cool: 2.2, tier,
    dead: 0
  };
}

function startGame() {
  score = 0; wave = 1; lives = 3;
  parts = []; admin.used = false;
  player.nades = 0; player.rapidT = 0; player.nadeCool = 0;
  spawnWave();
  state = "play";
}
function nextWave() { wave++; parts = []; spawnWave(); state = "play"; }

/* ------------------------------------------------------------------ *
 *  Helpers                                                           *
 * ------------------------------------------------------------------ */

function boom(x, y, color, n, spread, life = 0.6) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * spread;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20,
                 life: life * (0.5 + Math.random() * 0.8), t: 0, color,
                 size: 1 + Math.random() * 2.5 });
  }
}
function shake(amp, t) { shakeAmp = Math.max(shakeAmp, amp); shakeT = Math.max(shakeT, t); }

function detonate(x, y, radius) {
  blasts.push({ x, y, r: 8, max: radius, t: 0, life: 0.42 });
  boom(x, y, "#ffb347", 34, 190, 0.7);
  boom(x, y, "#fff2c2", 12, 120, 0.5);
  shake(7, 0.3);
  // the visible fireball is wider than its lethal core, so near misses singe
  if (player.alive && player.inv <= 0) {
    const dx = player.x - x, dy = player.y - y, lethal = radius * 0.72;
    if (dx * dx + dy * dy < lethal * lethal) killPlayer();
  }
}

function killPlayer() {
  if (!player.alive || player.inv > 0 || admin.immortal) return;
  player.alive = false;
  lives--;
  boom(player.x, player.y, "#7dffb2", 40, 200, 0.9);
  boom(player.x, player.y, "#ffffff", 14, 120, 0.6);
  shake(9, 0.45);
  if (lives <= 0) gameOver();
  else setTimeout(() => {
    if (state === "play" || state === "paused" || state === "admin") {
      player.alive = true; player.x = W / 2; player.y = 596; player.inv = 2.0;
    }
  }, 900);
}
function gameOver() {
  state = "over";
  if (score > hiScore && !admin.used) {
    hiScore = score;
    try { localStorage.setItem("si_hi", String(hiScore)); } catch (e) {}
  }
}

function hurtPlayerAt(x, y, halfW, halfH) {
  // the admin shield lets shots pass straight through rather than eating them
  return player.alive && player.inv <= 0 && !admin.immortal &&
         Math.abs(x - player.x) < player.w / 2 - 3 + halfW &&
         Math.abs(y - player.y) < player.h / 2 + halfH;
}

/* ---- boosters: dropped by specials, collected by flying into them ---- */

function dropBooster(x, y) {
  boosters.push({ x, y, vy: 62, kind: Math.random() < 0.5 ? "grenade" : "rapid", t: 0 });
}

function updateBoosters(dt) {
  for (let i = boosters.length - 1; i >= 0; i--) {
    const b = boosters[i];
    b.t += dt;
    b.y += b.vy * dt;
    if (b.y > H + 20) { boosters.splice(i, 1); continue; }
    if (player.alive && Math.abs(b.x - player.x) < 36 && Math.abs(b.y - player.y) < 30) {
      boosters.splice(i, 1);
      score += 25;
      if (b.kind === "rapid") {
        player.rapidT = Math.min(16, player.rapidT + 8);
      } else {
        player.nades = Math.min(6, player.nades + 2);
      }
      boom(b.x, b.y, b.kind === "rapid" ? "#ffe14d" : "#ff9a5a", 14, 110, 0.45);
    }
  }
}

/* ---- the ship's grenades ---- */

function throwGrenade() {
  player.nades--;
  player.nadeCool = 0.42;
  grenades.push({ x: player.x, y: player.y - 18, vx: 0, vy: -320,
                  fuse: 1.15, spin: 0, power: 96 });
}

function playerBlast(x, y, radius) {
  blasts.push({ x, y, r: 8, max: radius, t: 0, life: 0.45 });
  boom(x, y, "#ffd28a", 34, 200, 0.7);
  boom(x, y, "#ffffff", 12, 130, 0.45);
  shake(8, 0.32);
  const r2 = radius * radius;
  for (const e of enemies) {
    if (!e.alive) continue;
    const dx = e.x - x, dy = e.y - y;
    if (dx * dx + dy * dy <= r2) hitAlien(e, 2);
  }
  for (let i = phantoms.length - 1; i >= 0; i--) {
    const p = phantoms[i];
    const dx = p.x - x, dy = p.y - y;
    if (dx * dx + dy * dy <= r2) {
      phantoms.splice(i, 1);
      score += 60;
      boom(p.x, p.y, "#c58bff", 18, 150, 0.6);
    }
  }
  if (boss && !boss.dead &&
      Math.abs(boss.x - x) < radius + boss.w / 2 && Math.abs(boss.y - y) < radius + boss.h / 2) {
    boss.hp -= 8; boss.flash = 0.14;
    if (boss.hp <= 0) killBoss();
  }
}

function hitAlien(e, dmg) {
  e.hp -= dmg;
  if (e.hp > 0) {
    e.flash = 0.14;
    boom(e.x, e.y, "#ffd9d9", 8, 90, 0.35);
    return false;
  }
  e.alive = false;
  score += e.type.points * (e.special ? 3 : 1);
  boom(e.x, e.y, e.special ? e.type.hot : e.type.color, e.special ? 26 : 18, 150, 0.6);
  boom(e.x, e.y, "#ffffff", 6, 90, 0.35);
  if (e.special) dropBooster(e.x, e.y);      // specials leave a booster behind
  return true;
}

/* ---- enemy weapons ---- */

function enemyFire(e) {
  const x = e.x, y = e.y + e.type.h / 2 + 4;
  if (e.special) {
    // specials only shoot -- what they leave behind is the booster
    e.burst = e.key === "yellow" ? 6 : 4;
    e.burstGap = e.key === "yellow" ? 0.085 : 0.12;
    e.burstT = 0;
    return;
  }
  switch (e.type.shot) {
    case "fireball":
      eBullets.push({ x, y, vx: 0, vy: 150, kind: "fire", r: 7, t: 0 });
      break;
    case "rapid":
      e.burst = 3; e.burstGap = 0.13; e.burstT = 0;
      break;
    case "heavy":
      eBullets.push({ x, y, vx: 0, vy: 230, kind: "heavy", r: 4, t: 0 });
      break;
    default:
      eBullets.push({ x, y, vx: 0, vy: 200, kind: "normal", r: 3, t: 0 });
  }
}

/* ---- boss weapons ---- */

function bossSummonAliens() {
  const keys = ["red", "orange", "yellow"];
  const n = 2 + Math.floor(Math.random() * 2);
  for (let i = 0; i < n; i++) {
    const k = keys[Math.floor(Math.random() * keys.length)];
    const special = Math.random() < 0.25 + boss.tier * 0.08;
    const x = 80 + Math.random() * (W - 160);
    enemies.push(makeAlien(k, x, boss.y + 30 + Math.random() * 40, true, special));
    boom(x, boss.y + 40, TYPES[k].color, 10, 90, 0.4);
  }
}
const MAX_PHANTOMS = 3;
function bossSummonPhantoms() {
  const n = Math.min(2, MAX_PHANTOMS - phantoms.length);
  for (let i = 0; i < n; i++) {
    phantoms.push({
      x: 100 + Math.random() * (W - 200), y: boss.y + 20,
      baseX: 0, hp: 2, t: Math.random() * 4, flash: 0,
      vy: 95 + Math.random() * 45, cool: 1.2 + Math.random(), frame: 0, alive: true
    });
  }
}
function bossFireBeam() {
  beam = { x: boss.x, w: 96 + boss.tier * 8, t: 0, charge: 1.1, fireT: 0.95, phase: "charge",
           sweep: (Math.random() < 0.5 ? -1 : 1) * (26 + boss.tier * 8) };
}

/* ------------------------------------------------------------------ *
 *  Update                                                            *
 * ------------------------------------------------------------------ */

function update(dt) {
  for (const s of stars) { s.y += s.v * dt; if (s.y > H) { s.y = -2; s.x = Math.random() * W; } }
  if (shakeT > 0) { shakeT -= dt; if (shakeT <= 0) shakeAmp = 0; }

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.t += dt;
    if (p.t >= p.life) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 210 * dt; p.vx *= 0.99;
  }
  for (let i = blasts.length - 1; i >= 0; i--) {
    const b = blasts[i]; b.t += dt;
    if (b.t >= b.life) { blasts.splice(i, 1); continue; }
    b.r = 8 + (b.max - 8) * Math.min(1, b.t / b.life * 1.4);
  }

  if (state !== "play") return;

  const alive = enemies.filter(e => e.alive);
  const fleet = alive.filter(e => !e.free);

  /* ---- player ---- */
  if (player.alive) {
    if (player.inv > 0) player.inv -= dt;
    let vx = 0, vy = 0;
    if (left()) vx -= 1;
    if (right()) vx += 1;
    if (up()) vy -= 1;
    if (down()) vy += 1;
    if (vx && vy) { vx *= 0.7071; vy *= 0.7071; }
    player.x = Math.max(24, Math.min(W - 24, player.x + vx * player.speed * dt));
    player.y = Math.max(360, Math.min(608, player.y + vy * player.speed * dt * 0.85));

    if (player.rapidT > 0) player.rapidT -= dt;
    const rapid = player.rapidT > 0;
    player.cool -= dt;
    if (fire() && player.cool <= 0 && bullets.length < (rapid ? 6 : 3)) {
      bullets.push({ x: player.x, y: player.y - 16, vy: -560 });
      player.cool = rapid ? 0.09 : 0.26;
    }
    player.nadeCool -= dt;
    if (nade() && player.nades > 0 && player.nadeCool <= 0) throwGrenade();
    player.backCool = (player.backCool || 0) - dt;
    if (back() && player.backCool <= 0 && bBullets.length < 4) fireBackward();
  }

  /* ---- player bullets ---- */
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.y += b.vy * dt;
    if (b.y < -12) { bullets.splice(i, 1); continue; }

    // shoot a fireball or a grenade out of the air to set it off early
    let consumed = false;
    for (let j = eBullets.length - 1; j >= 0; j--) {
      const eb = eBullets[j];
      if (eb.kind !== "fire") continue;
      if (Math.abs(eb.x - b.x) < 10 && Math.abs(eb.y - b.y) < 12) {
        eBullets.splice(j, 1); detonate(eb.x, eb.y, 62); score += 5;
        bullets.splice(i, 1); consumed = true; break;
      }
    }
    if (consumed) continue;

    // cascade baseballs bat back; tracking ones cannot be deflected
    for (let j = balls.length - 1; j >= 0; j--) {
      const ba = balls[j];
      if (!ba.deflectable || ba.deflected) continue;
      if (Math.abs(ba.x - b.x) < ba.r + 4 && Math.abs(ba.y - b.y) < ba.r + 6) {
        bullets.splice(i, 1);
        ba.deflected = true;
        ba.life = Math.max(ba.life, 3);
        const a = boss && !boss.dead ? Math.atan2(boss.y - ba.y, boss.x - ba.x) : -Math.PI / 2;
        ba.vx = Math.cos(a) * 430; ba.vy = Math.sin(a) * 430;
        boom(ba.x, ba.y, "#ffe9a0", 10, 120, 0.35);
        score += 15;
        consumed = true; break;
      }
    }
    if (consumed) continue;

    // bombers and parachuting troopers are fair game for the forward gun;
    // once a trooper is on the ground only the backward gun [B] reaches it
    for (let j = bombers.length - 1; j >= 0; j--) {
      const bo = bombers[j];
      if (Math.abs(bo.x - b.x) < 20 && Math.abs(bo.y - b.y) < 12) {
        bullets.splice(i, 1);
        bo.hp--; bo.flash = 0.12;
        if (bo.hp <= 0) {
          bombers.splice(j, 1);
          score += 50;
          boom(bo.x, bo.y, "#ff9a2e", 20, 150, 0.6);
        }
        consumed = true; break;
      }
    }
    if (consumed) continue;
    for (let j = troopers.length - 1; j >= 0; j--) {
      const tr = troopers[j];
      if (tr.state === "land") continue;
      if (Math.abs(tr.x - b.x) < 13 && Math.abs(tr.y - b.y) < 15) {
        troopers.splice(j, 1);
        score += 15;
        boom(tr.x, tr.y, "#c8d8a0", 12, 120, 0.45);
        consumed = true; break;
      }
    }
    if (consumed) continue;

    // knives are deflected by a well-placed shot and fly back at the shark
    for (let j = knives.length - 1; j >= 0; j--) {
      const k = knives[j];
      if (k.deflected) continue;
      if (Math.abs(k.x - b.x) < 14 && Math.abs(k.y - b.y) < 15) {
        bullets.splice(i, 1);
        k.deflected = true;
        k.ang = boss && !boss.dead ? Math.atan2(boss.y - k.y, boss.x - k.x) : -Math.PI / 2;
        boom(k.x, k.y, "#ffe9a0", 10, 120, 0.35);
        score += 15;
        consumed = true; break;
      }
    }
    if (consumed) continue;

    // boss (untouchable while it is under the water)
    if (boss && !boss.dead && !boss.sub &&
        Math.abs(boss.x - b.x) < boss.w / 2 && Math.abs(boss.y - b.y) < boss.h / 2) {
      bullets.splice(i, 1);
      boss.hp--; boss.flash = 0.1;
      boom(b.x, b.y - 6, "#e8c4ff", 6, 90, 0.3);
      if (boss.hp <= 0) killBoss();
      continue;
    }

    // phantoms
    for (let j = phantoms.length - 1; j >= 0; j--) {
      const p = phantoms[j];
      if (Math.abs(p.x - b.x) < 15 && Math.abs(p.y - b.y) < 15) {
        bullets.splice(i, 1);
        p.hp--; p.flash = 0.12;
        if (p.hp <= 0) {
          phantoms.splice(j, 1);
          score += 60;
          boom(p.x, p.y, "#c58bff", 18, 150, 0.6);
        }
        consumed = true; break;
      }
    }
    if (consumed) continue;

    // aliens
    for (const e of alive) {
      if (!e.alive) continue;
      if (Math.abs(e.x - b.x) < e.type.w / 2 && Math.abs(e.y - b.y) < e.type.h / 2 + 2) {
        bullets.splice(i, 1);
        hitAlien(e, 1);
        break;
      }
    }
  }

  /* ---- formation movement ---- */
  if (fleet.length) {
    const total = ROWS * COLS;
    const prog = 1 - fleet.length / total;
    const speed = (16 + wave * 3.5) * (1 + prog * 4.6);
    let minX = Infinity, maxX = -Infinity;
    for (const e of fleet) { if (e.x < minX) minX = e.x; if (e.x > maxX) maxX = e.x; }

    if (dropPending > 0) {
      const stepDown = Math.min(dropPending, 220 * dt);
      for (const e of fleet) e.y += stepDown;
      dropPending -= stepDown;
    } else {
      const dx = dir * speed * dt;
      if (dir > 0 && maxX + dx > W - 26) { dir = -1; dropPending = 13; }
      else if (dir < 0 && minX + dx < 26) { dir = 1; dropPending = 13; }
      else for (const e of fleet) e.x += dx;
    }

    stepSnd -= dt * (1 + prog * 2.5);
    if (stepSnd <= 0) {
      stepSnd = 0.62;
      for (const e of fleet) e.frame ^= 1;
    }
  }

  /* ---- free-floating (summoned) aliens ----
     They harass on their way down and loop back around at the bottom; only
     the marching fleet can actually overrun you. */
  for (const e of alive) {
    if (!e.free) continue;
    e.swayT += dt;
    e.y += 16 * dt;
    e.x += Math.sin(e.swayT * 1.3) * 42 * dt;
    e.x = Math.max(26, Math.min(W - 26, e.x));
    if (e.y > H + 24) { e.y = -24; e.x = 60 + Math.random() * (W - 120); }
    e.frameT = (e.frameT || 0) + dt;
    if (e.frameT > 0.5) { e.frameT = 0; e.frame ^= 1; }
  }

  /* ---- invasion check ---- */
  for (const e of alive) {
    if (e.free) continue;
    if (e.y + e.type.h / 2 >= GROUND_Y) {
      if (admin.immortal) { e.y = 90; continue; }   // the shield sweeps them back
      boom(e.x, e.y, "#ff5555", 40, 220, 1.0);
      shake(12, 0.6);
      lives = 0; gameOver();
      break;
    }
  }

  /* ---- alien shooting ----
     Every alien can shoot, so all four types stay in play from the first
     second. Cooldowns are stretched by how many aliens are left, which keeps
     the total volume of incoming fire roughly constant as the wave thins. */
  const rate = 1 + (wave - 1) * 0.14;
  const load = Math.max(1, alive.length / 4);
  for (const e of alive) {
    if (e.flash > 0) e.flash -= dt;
    if (e.burst > 0) {
      e.burstT -= dt;
      if (e.burstT <= 0) {
        e.burstT = e.burstGap; e.burst--;
        eBullets.push({ x: e.x, y: e.y + e.type.h / 2 + 4, vx: 0, vy: 300,
                        kind: "rapid", col: e.special ? e.type.hot : "#ffe14d", r: 3, t: 0 });
      }
      continue;
    }
    if (eBullets.length > 16) continue;
    e.cool -= dt * rate / load;
    if (e.cool <= 0) {
      e.cool = e.type.fireMin + Math.random() * (e.type.fireMax - e.type.fireMin);
      if (e.special) e.cool *= 0.8;
      enemyFire(e);
    }
  }

  updateBoss(dt);
  updatePhantoms(dt);
  updateGrenades(dt);
  updateBoosters(dt);
  updateLasers(dt);
  updateKnives(dt);
  updateTridents(dt);
  updateOrbs(dt);
  updateBalls(dt);
  updateWalls(dt);
  updateBombers(dt);
  updateBombs(dt);
  updateTroopers(dt);
  updateBackBullets(dt);
  updateBeam(dt);
  if (blackout > 0) blackout -= dt;

  /* ---- enemy bullets ---- */
  for (let i = eBullets.length - 1; i >= 0; i--) {
    const b = eBullets[i];
    b.t += dt;
    b.y += b.vy * dt;
    b.x += b.vx * dt;
    if (b.y > H + 16 || b.x < -20 || b.x > W + 20) {
      if (b.kind === "fire") detonate(b.x, H - 6, 52);
      else if (b.kind === "boom" && b.y > H) detonate(b.x, H - 6, 54);
      eBullets.splice(i, 1); continue;
    }
    if (hurtPlayerAt(b.x, b.y, 0, 0)) {
      eBullets.splice(i, 1);
      if (b.kind === "fire") detonate(b.x, b.y, 58);
      else if (b.kind === "boom") detonate(b.x, b.y, 54);
      else killPlayer();
    }
  }

  /* ---- wave resolution ---- */
  const anythingLeft = enemies.some(e => e.alive) || phantoms.length || boss;
  if (!anythingLeft) {
    waveTimer += dt;
    if (waveTimer > 0.8) { waveTimer = 0; state = "wavedone"; }
  } else waveTimer = 0;
}

/* ---- boss ---- */

function killBoss() {
  boss.dead = 1.4;
  score += 1000;
  beam = null;
  boom(boss.x, boss.y, "#ffffff", 30, 160, 0.8);
  shake(14, 0.8);
}

/* ------------------------------------------------------------------ *
 *  Knife Shark (wave 10)                                             *
 * ------------------------------------------------------------------ */

function sparkBlast(x, y, radius) {
  blasts.push({ x, y, r: 8, max: radius, t: 0, life: 0.5, electric: true });
  boom(x, y, "#9fe8ff", 30, 210, 0.6);
  boom(x, y, "#ffffff", 14, 150, 0.4);
  shake(9, 0.35);
  if (player.alive && player.inv <= 0) {
    const dx = player.x - x, dy = player.y - y, lethal = radius * 0.7;
    if (dx * dx + dy * dy < lethal * lethal) killPlayer();
  }
}

function sharkStart(mode) {
  boss.mode = mode;
  boss.modeT = 0;
  boss.shots = 0;
  boss.shotT = 0;
  if (mode === "knives") boss.shots = 10;              // 10 homing knives
  if (mode === "tridents") boss.shots = 4;             // 4 huge straight tridents
  if (mode === "rapid") boss.shots = 14;
  if (mode === "oranges") {
    for (let i = 0; i < 3; i++) {
      const x = 90 + Math.random() * (W - 180);
      enemies.push(makeAlien("orange", x, boss.y + 40 + Math.random() * 40, true, false));
      boom(x, boss.y + 40, TYPES.orange.color, 10, 90, 0.4);
    }
    boss.mode = null;
  }
  if (mode === "submerge") { boss.sub = true; boss.subT = 10; boss.shotT = 0.6; }
  if (mode === "ambush") {
    boss.sub = true;
    boss.subT = 10;
    boss.ambush = { x: player.x, w: 170, t: 0, warn: 1.7, leap: 0 };
  }
}

function sharkThrowKnife() {
  const aim = Math.atan2(player.y - boss.y, player.x - boss.x) + (Math.random() - 0.5) * 0.9;
  const sp = 190;
  knives.push({ x: boss.x + (Math.random() - 0.5) * 60, y: boss.y + 10,
                vx: Math.cos(aim) * sp, vy: Math.sin(aim) * sp,
                ang: aim, life: 9, deflected: false, spin: 0 });
}

function sharkThrowTrident(i) {
  // fanned out, then dead straight -- no tracking
  const spread = (i - 1.5) * 0.28;
  const aim = Math.atan2(player.y - boss.y, player.x - boss.x) + spread;
  const sp = 250;
  tridents.push({ x: boss.x, y: boss.y + 16,
                  vx: Math.cos(aim) * sp, vy: Math.sin(aim) * sp,
                  ang: aim, live: true });
}

function sharkShootOrb() {
  const aim = Math.atan2(player.y - (WATER_Y - 6), player.x - boss.finX) + (Math.random() - 0.5) * 0.3;
  const sp = 185;
  orbs.push({ x: boss.finX, y: WATER_Y - 6, vx: Math.cos(aim) * sp, vy: Math.sin(aim) * sp, t: 0, r: 13 });
}

function sharkEatPlayer() {
  boom(player.x, player.y, "#ff3b52", 60, 260, 1.1);
  boom(player.x, player.y, "#ffffff", 26, 180, 0.7);
  shake(16, 0.9);
  player.alive = false;
  lives = 0;
  gameOver();
}

function updateShark(dt) {
  boss.t += dt;
  if (boss.flash > 0) boss.flash -= dt;
  boss.frameT += dt;
  if (boss.frameT > 0.28) { boss.frameT = 0; boss.frame ^= 1; }

  if (boss.phase === 1 && boss.hp <= boss.maxHp / 2) {
    boss.phase = 2;
    boss.flash = 0.5;
    boom(boss.x, boss.y, "#9fe8ff", 40, 220, 0.9);
    shake(10, 0.6);
  }

  /* ---- submerged: immortal, must surface within 10s ---- */
  if (boss.sub) {
    boss.subT -= dt;
    const targetFin = boss.ambush ? boss.ambush.x : player.x;
    boss.finX += Math.max(-190 * dt, Math.min(190 * dt, targetFin - boss.finX));
    boss.finX = Math.max(40, Math.min(W - 40, boss.finX));

    if (boss.ambush) {
      const a = boss.ambush;
      a.t += dt;
      if (a.leap > 0) {
        a.leap -= dt;
        if (a.leap <= 0) { boss.ambush = null; boss.sub = false; boss.mode = null; boss.y = boss.homeY; }
      } else if (a.t >= a.warn) {
        // burst out of the water; anything inside the marked band is eaten
        a.leap = 0.9;
        boss.x = a.x; boss.y = WATER_Y - 40;
        boom(a.x, WATER_Y, "#7fd4ff", 44, 260, 0.8);
        shake(14, 0.7);
        if (player.alive && player.inv <= 0 && !admin.immortal &&
            Math.abs(player.x - a.x) < a.w / 2 && player.y > 340) sharkEatPlayer();
      }
      return;
    }

    boss.shotT -= dt;
    if (boss.shotT <= 0 && orbs.length < 7) { boss.shotT = 0.75; sharkShootOrb(); }
    if (boss.subT <= 0) {                       // forced back up
      boss.sub = false; boss.mode = null;
      boss.x = boss.finX; boss.y = boss.homeY;
      boom(boss.x, WATER_Y, "#7fd4ff", 30, 200, 0.7);
      shake(8, 0.4);
    }
    return;
  }

  /* ---- surfaced: cruise side to side ---- */
  boss.x += boss.vx * dt;
  if (boss.x > W - boss.w / 2 - 10) { boss.x = W - boss.w / 2 - 10; boss.vx *= -1; }
  if (boss.x < boss.w / 2 + 10) { boss.x = boss.w / 2 + 10; boss.vx *= -1; }
  boss.facing = boss.vx < 0 ? 1 : -1;
  boss.y = boss.homeY + Math.sin(boss.t * 0.8) * 22;

  /* ---- run the active attack ---- */
  if (boss.mode) {
    boss.modeT += dt;
    boss.shotT -= dt;
    if (boss.mode === "knives" && boss.shots > 0 && boss.shotT <= 0) {
      boss.shotT = 0.16; boss.shots--; sharkThrowKnife();
      if (boss.shots === 0) boss.mode = null;
    } else if (boss.mode === "tridents" && boss.shots > 0 && boss.shotT <= 0) {
      boss.shotT = 0.28; sharkThrowTrident(4 - boss.shots); boss.shots--;
      if (boss.shots === 0) boss.mode = null;
    } else if (boss.mode === "rapid" && boss.shots > 0 && boss.shotT <= 0) {
      boss.shotT = 0.11; boss.shots--;
      const aim = Math.atan2(player.y - boss.y, player.x - boss.x) + (Math.random() - 0.5) * 0.24;
      const sp = 330;
      eBullets.push({ x: boss.x, y: boss.y + 14, vx: Math.cos(aim) * sp, vy: Math.sin(aim) * sp,
                      kind: "rapid", col: "#ff9aa0", r: 3, t: 0 });
      if (boss.shots === 0) boss.mode = null;
    }
    if (boss.modeT > 8) boss.mode = null;      // safety valve
    return;
  }

  boss.cool -= dt;
  if (boss.cool > 0) return;
  boss.cool = Math.max(1.6, 3.2 - boss.tier * 0.2);
  const opts = ["knives", "oranges", "tridents", "rapid"];
  if (boss.phase === 2) opts.push("submerge", "ambush");
  sharkStart(opts[Math.floor(Math.random() * opts.length)]);
}

/* ---- knives: home in slowly, but a bullet turns them around ---- */

function updateKnives(dt) {
  for (let i = knives.length - 1; i >= 0; i--) {
    const k = knives[i];
    k.life -= dt; k.spin += dt * 4;
    if (k.life <= 0 || k.x < -40 || k.x > W + 40 || k.y > H + 40 || k.y < -60) { knives.splice(i, 1); continue; }

    const sp = k.deflected ? 430 : 205;
    if (!k.deflected) {
      const want = Math.atan2(player.y - k.y, player.x - k.x);
      let d = want - k.ang;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      const turn = 1.5 * dt;
      k.ang += Math.max(-turn, Math.min(turn, d));
    }
    k.vx = Math.cos(k.ang) * sp; k.vy = Math.sin(k.ang) * sp;
    k.x += k.vx * dt; k.y += k.vy * dt;

    if (k.deflected) {
      if (boss && !boss.dead && !boss.sub &&
          Math.abs(boss.x - k.x) < boss.w / 2 && Math.abs(boss.y - k.y) < boss.h / 2) {
        knives.splice(i, 1);
        boss.hp -= 3; boss.flash = 0.12;
        boom(k.x, k.y, "#ffe9a0", 14, 130, 0.5);
        score += 30;
        if (boss.hp <= 0) killBoss();
      }
      continue;
    }
    if (hurtPlayerAt(k.x, k.y, 6, 6)) { knives.splice(i, 1); killPlayer(); }
  }
}

/* ---- tridents: dead straight; in phase 2 they burst into sparks ---- */

function updateTridents(dt) {
  for (let i = tridents.length - 1; i >= 0; i--) {
    const t = tridents[i];
    t.x += t.vx * dt; t.y += t.vy * dt;
    const gone = t.x < -70 || t.x > W + 70 || t.y > H + 40 || t.y < -70;
    const hit = hurtPlayerAt(t.x, t.y, 14, 26);
    if (hit || gone) {
      tridents.splice(i, 1);
      if (boss && boss.kind === "shark" && boss.phase === 2 && !gone) sparkBlast(t.x, t.y, 118);
      else if (boss && boss.kind === "shark" && boss.phase === 2 && t.y > H)
        sparkBlast(t.x, H - 10, 118);
      else if (hit) killPlayer();
      continue;
    }
  }
}

/* ---- water orbs ---- */

function updateOrbs(dt) {
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    o.t += dt;
    o.x += o.vx * dt; o.y += o.vy * dt;
    if (o.x < -30 || o.x > W + 30 || o.y > H + 30 || o.y < -30) { orbs.splice(i, 1); continue; }
    if (hurtPlayerAt(o.x, o.y, o.r - 4, o.r - 4)) {
      orbs.splice(i, 1);
      boom(o.x, o.y, "#7fd4ff", 16, 140, 0.5);
      killPlayer();
    }
  }
}

/* ------------------------------------------------------------------ *
 *  Baseball Hunter (wave 15)                                         *
 * ------------------------------------------------------------------ */

// phase 3 turns every baseball into a bomb
const ballsExplode = () => boss && boss.kind === "baseball" && boss.phase === 3;

function newBall(o) {
  return {
    x: o.x, y: o.y, vx: o.vx, vy: o.vy, r: o.r || 10,
    life: o.life || 8, spin: Math.random() * 6,
    track: !!o.track, split: !!o.split,
    deflectable: o.deflectable !== false, deflected: false
  };
}

function splitBall(b) {
  for (let i = 0; i < 3; i++) {
    const a = -Math.PI / 2 + (i - 1) * 0.8 + Math.random() * 0.3;
    balls.push(newBall({ x: b.x, y: b.y, vx: Math.cos(a) * 110, vy: Math.sin(a) * 110,
                         r: 7, life: Math.max(0.8, b.life), track: true, split: false,
                         deflectable: false }));
  }
  boom(b.x, b.y, "#ffffff", 14, 130, 0.4);
}

function hunterStart(mode) {
  boss.mode = mode;
  boss.modeT = 0;
  boss.shotT = 0;
  if (mode === "barrage") boss.shots = 16;
  if (mode === "tracker") { boss.shots = 1; boss.swing = 0.45; }
  if (mode === "wall") {
    boss.shots = 0;
    const gapW = 150;
    const vy = 76 + boss.tier * 8;
    const lo = 70 + gapW / 2, hi = W - 70 - gapW / 2;
    const gapX = lo + Math.random() * (hi - lo);
    walls.push({ y: 190, gapX: gapX, gapW: gapW, vy: vy, warn: 1.4, t: 0 });
    if (boss.phase === 3) {
      // A second wall, but only where the crossing is actually makeable:
      // the ship has (gap between walls)/vy seconds to cover the x distance.
      const seconds = (190 - 10) / vy + (3.0 - 1.4);
      const reach = player.speed * seconds * 0.45;        // 55% safety margin
      const g2 = Math.max(lo, Math.min(hi,
                   gapX + (Math.random() * 2 - 1) * Math.min(reach, hi - lo)));
      walls.push({ y: 10, gapX: g2, gapW: gapW, vy: vy, warn: 3.0, t: 0 });
    }
    boss.mode = null;
  }
}

function updateHunter(dt) {
  boss.t += dt;
  if (boss.flash > 0) boss.flash -= dt;
  if (boss.swing > 0) boss.swing -= dt;
  boss.frameT += dt;
  if (boss.frameT > 0.3) { boss.frameT = 0; boss.frame ^= 1; }

  const frac = boss.hp / boss.maxHp;
  const ph = frac > 2 / 3 ? 1 : frac > 1 / 3 ? 2 : 3;
  if (ph !== boss.phase) {
    boss.phase = ph;
    boss.flash = 0.5;
    boom(boss.x, boss.y, ph === 3 ? "#ff9a2e" : "#ffe14d", 40, 220, 0.9);
    shake(10, 0.6);
  }

  boss.x += boss.vx * dt;
  if (boss.x > W - boss.w / 2 - 10) { boss.x = W - boss.w / 2 - 10; boss.vx *= -1; }
  if (boss.x < boss.w / 2 + 10) { boss.x = boss.w / 2 + 10; boss.vx *= -1; }
  boss.y = 128 + Math.sin(boss.t * 0.9) * 14;

  if (boss.mode) {
    boss.modeT += dt;
    boss.shotT -= dt;
    if (boss.mode === "barrage" && boss.shots > 0 && boss.shotT <= 0) {
      // fanned so the cascade covers the whole width
      const i = 16 - boss.shots;
      const targetX = 40 + i * (W - 80) / 15;
      const flight = 1.8;
      boss.shotT = 0.11; boss.shots--;
      balls.push(newBall({ x: boss.x, y: boss.y + 20,
                           vx: (targetX - boss.x) / flight, vy: 95 + Math.random() * 30,
                           r: 10, life: 9, deflectable: true }));
      if (boss.shots === 0) boss.mode = null;
    } else if (boss.mode === "tracker" && boss.shots > 0 && boss.shotT <= 0) {
      boss.shots--;
      if (balls.some(b => b.track && b.split)) { boss.mode = null; return; }
      const a = Math.atan2(player.y - boss.y, player.x - boss.x);
      balls.push(newBall({ x: boss.x, y: boss.y + 20,
                           vx: Math.cos(a) * 140, vy: Math.sin(a) * 140,
                           r: 15, life: 5, track: true, split: true, deflectable: false }));
      boss.mode = null;
    }
    if (boss.modeT > 9) boss.mode = null;
    return;
  }

  // while a gap is on the board the crossing is the only thing to deal with:
  // no cascades, no trackers, and no second wall stacked on top of it
  if (walls.length) { boss.cool = Math.max(boss.cool, 0.7); return; }

  boss.cool -= dt;
  if (boss.cool > 0) return;
  boss.cool = Math.max(1.5, 3.0 - boss.tier * 0.2);
  // never more than one big tracker in the air at a time
  const trackerOut = balls.some(b => b.track && b.split);
  const opts = ["barrage"];
  if (!trackerOut) opts.push("tracker");
  if (boss.phase >= 2) opts.push("wall");
  if (boss.phase >= 3) opts.push("wall");            // walls come thicker late on
  hunterStart(opts[Math.floor(Math.random() * opts.length)]);
}

function updateBalls(dt) {
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    b.life -= dt; b.spin += dt * 9;
    if (b.life <= 0) {
      balls.splice(i, 1);
      if (ballsExplode() && !b.deflected) detonate(b.x, b.y, 66);
      continue;
    }

    if (b.deflected) {                              // sent back at the hunter
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (boss && !boss.dead && !boss.sub &&
          Math.abs(boss.x - b.x) < boss.w / 2 && Math.abs(boss.y - b.y) < boss.h / 2) {
        balls.splice(i, 1);
        boss.hp -= 3; boss.flash = 0.12;
        boom(b.x, b.y, "#ffe9a0", 14, 130, 0.5);
        score += 25;
        if (boss.hp <= 0) killBoss();
        continue;
      }
      if (b.x < -40 || b.x > W + 40 || b.y < -40 || b.y > H + 40) balls.splice(i, 1);
      continue;
    }

    if (b.track) {                                  // steers, and cannot be deflected
      const want = Math.atan2(player.y - b.y, player.x - b.x);
      let ang = Math.atan2(b.vy, b.vx);
      let d = want - ang;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      // turn rate scaled with the slower speed so it still overshoots into walls
      const turn = 1.2 * dt;
      ang += Math.max(-turn, Math.min(turn, d));
      const sp = Math.hypot(b.vx, b.vy) || 140;
      b.vx = Math.cos(ang) * sp; b.vy = Math.sin(ang) * sp;
    }

    b.x += b.vx * dt; b.y += b.vy * dt;

    // wall impact: the big tracker breaks into little ones
    let wallHit = false;
    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); wallHit = true; }
    else if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); wallHit = true; }
    if (b.y < b.r + 40) { b.y = b.r + 40; b.vy = Math.abs(b.vy); wallHit = true; }
    if (wallHit && b.split) { splitBall(b); balls.splice(i, 1); continue; }

    // the floor counts as a wall: an overshooting tracker breaks up on it
    if (b.split && b.y > H - 26) { splitBall(b); balls.splice(i, 1); continue; }
    if (b.y > H + 30) {
      balls.splice(i, 1);
      if (ballsExplode()) detonate(b.x, H - 8, 66);
      continue;
    }
    if (hurtPlayerAt(b.x, b.y, b.r - 3, b.r - 3)) {
      balls.splice(i, 1);
      if (ballsExplode()) detonate(b.x, b.y, 66); else killPlayer();
    }
  }
}

/* ---- laser hold: a descending row of baseballs with one gap ---- */

function updateWalls(dt) {
  for (let i = walls.length - 1; i >= 0; i--) {
    const w = walls[i];
    w.t += dt;
    if (w.t < w.warn) continue;                     // telegraph first
    w.y += w.vy * dt;
    if (w.y > H + 30) { walls.splice(i, 1); continue; }
    if (player.alive && player.inv <= 0 &&
        Math.abs(player.y - w.y) < 16 &&
        Math.abs(player.x - w.gapX) > w.gapW / 2 - 6) {
      if (ballsExplode()) detonate(player.x, w.y, 66); else killPlayer();
    }
  }
}

/* ------------------------------------------------------------------ *
 *  Air Force Commander (wave 20)                                     *
 * ------------------------------------------------------------------ */

function commanderStart(mode) {
  boss.mode = mode;
  boss.modeT = 0;
  boss.shotT = 0;
  if (mode === "bombers") boss.shots = 5;          // a swooping fleet
  if (mode === "para") boss.shots = 7;             // seven per drop, 15 on the field
  if (mode === "rapid") boss.shots = 18;
  if (mode === "blackout") { blackout = 1.0; boss.mode = null; shake(5, 0.3); }
}

function launchBomber(i) {
  const fromLeft = i % 2 === 0;
  bombers.push({
    x: fromLeft ? -50 : W + 50, y: 168,
    dir: fromLeft ? 1 : -1, t: 0, dur: 3.4, hp: 2, flash: 0,
    frame: 0, frameT: 0, dropped: false
  });
}

function dropTrooper() {
  troopers.push({
    x: 60 + Math.random() * (W - 120), y: boss.y + 24,
    vy: 52 + Math.random() * 18, t: Math.random() * 4,
    state: "fall", swing: 0, dx: 0, dy: 0
  });
}

function updateCommander(dt) {
  boss.t += dt;
  if (boss.flash > 0) boss.flash -= dt;
  boss.frameT += dt;
  if (boss.frameT > 0.12) { boss.frameT = 0; boss.frame ^= 1; }

  const frac = boss.hp / boss.maxHp;
  const ph = frac > 2 / 3 ? 1 : frac > 1 / 3 ? 2 : 3;
  if (ph !== boss.phase) {
    boss.phase = ph;
    boss.flash = 0.5;
    boom(boss.x, boss.y, ph === 3 ? "#ff5566" : "#ffd06a", 40, 220, 0.9);
    shake(10, 0.6);
  }

  boss.x += boss.vx * dt;
  if (boss.x > W - boss.w / 2 - 8) { boss.x = W - boss.w / 2 - 8; boss.vx *= -1; }
  if (boss.x < boss.w / 2 + 8) { boss.x = boss.w / 2 + 8; boss.vx *= -1; }
  boss.facing = boss.vx > 0 ? 1 : -1;
  boss.y = 96 + Math.sin(boss.t * 1.1) * 10;

  if (boss.mode) {
    boss.modeT += dt;
    boss.shotT -= dt;
    if (boss.mode === "bombers" && boss.shots > 0 && boss.shotT <= 0) {
      boss.shotT = 0.42; launchBomber(5 - boss.shots); boss.shots--;
      if (boss.shots === 0) boss.mode = null;
    } else if (boss.mode === "para" && boss.shots > 0 && boss.shotT <= 0) {
      if (troopers.length >= MAX_TROOPERS) { boss.mode = null; return; }   // hard ceiling
      boss.shotT = 0.22; dropTrooper(); boss.shots--;
      if (boss.shots === 0) boss.mode = null;
    } else if (boss.mode === "rapid" && boss.shots > 0 && boss.shotT <= 0) {
      boss.shotT = 0.1; boss.shots--;
      const a = Math.atan2(player.y - boss.y, player.x - boss.x) + (Math.random() - 0.5) * 0.22;
      const sp = 340;
      eBullets.push({ x: boss.x, y: boss.y + 16, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                      kind: "boom", col: "#ff4a52", r: 4, t: 0 });
      if (boss.shots === 0) boss.mode = null;
    }
    if (boss.modeT > 9) boss.mode = null;
    return;
  }

  boss.cool -= dt;
  if (boss.cool > 0) return;
  boss.cool = Math.max(1.6, 3.2 - boss.tier * 0.2);
  // don't call in another drop while the ground is still crowded
  const opts = ["bombers"];
  if (troopers.length < MAX_TROOPERS) opts.push("para");
  if (boss.phase >= 2) opts.push("rapid");
  if (boss.phase >= 3) { opts.push("rapid"); opts.push("blackout"); }
  commanderStart(opts[Math.floor(Math.random() * opts.length)]);
}

/* ---- bombers: swoop low, drop a bomb, climb away and vanish ---- */

function updateBombers(dt) {
  for (let i = bombers.length - 1; i >= 0; i--) {
    const b = bombers[i];
    b.t += dt;
    if (b.flash > 0) b.flash -= dt;
    b.frameT += dt;
    if (b.frameT > 0.1) { b.frameT = 0; b.frame ^= 1; }
    const k = b.t / b.dur;
    b.x += b.dir * (W + 140) / b.dur * dt;
    b.y = 168 + Math.sin(Math.min(1, k) * Math.PI) * 250;
    if (!b.dropped && k > 0.48) {                 // bombs away at the bottom of the arc
      b.dropped = true;
      bombs.push({ x: b.x, y: b.y + 12, vx: b.dir * 40, vy: 60 });
    }
    if (k >= 1) { bombers.splice(i, 1); continue; }   // despawn after the run
    if (hurtPlayerAt(b.x, b.y, 16, 10)) killPlayer();
  }
}

function updateBombs(dt) {
  for (let i = bombs.length - 1; i >= 0; i--) {
    const g = bombs[i];
    g.vy += 210 * dt;
    g.x += g.vx * dt; g.y += g.vy * dt;
    if (g.y > H - 12 || hurtPlayerAt(g.x, g.y, 7, 9)) {
      bombs.splice(i, 1);
      detonate(g.x, Math.min(g.y, H - 10), 70);
    }
  }
}

/* ---- paratroopers: sword them near you, or shoot them on the ground ---- */

function updateTroopers(dt) {
  for (let i = troopers.length - 1; i >= 0; i--) {
    const t = troopers[i];
    t.t += dt;
    if (t.swing > 0) t.swing -= dt;

    if (t.state === "fall") {
      t.y += t.vy * dt;
      t.x += Math.sin(t.t * 1.3) * 16 * dt;
      const dx = player.x - t.x, dy = player.y - t.y;
      if (player.alive && dx * dx + dy * dy < 43 * 43) {   // cut the chute and charge
        const d = Math.hypot(dx, dy) || 1;
        t.state = "dive"; t.dx = dx / d; t.dy = dy / d; t.swing = 0.6;
      } else if (t.y >= TROOP_GROUND) { t.state = "land"; t.y = TROOP_GROUND; }
    } else if (t.state === "dive") {
      t.x += t.dx * 240 * dt; t.y += t.dy * 240 * dt;
      if (hurtPlayerAt(t.x, t.y, 12, 12)) { troopers.splice(i, 1); killPlayer(); continue; }
      if (t.y >= TROOP_GROUND) { t.state = "land"; t.y = TROOP_GROUND; }
      if (t.y > H + 30 || t.x < -30 || t.x > W + 30) { troopers.splice(i, 1); continue; }
    } else {                                              // landed: walk and slash upward
      t.x += Math.sign(player.x - t.x) * 46 * dt;
      if (Math.abs(player.x - t.x) < 15 && player.y > TROOP_GROUND - 33) {
        t.swing = Math.max(t.swing, 0.25);
        if (hurtPlayerAt(t.x, t.y - 11, 8, 17)) killPlayer();
      }
    }
  }
}

/* ---- the ship's backward gun ---- */

function fireBackward() {
  player.backCool = 0.3;
  bBullets.push({ x: player.x, y: player.y + 16, vy: 470 });
}

function updateBackBullets(dt) {
  for (let i = bBullets.length - 1; i >= 0; i--) {
    const b = bBullets[i];
    b.y += b.vy * dt;
    if (b.y > H + 14) { bBullets.splice(i, 1); continue; }
    let hit = false;
    for (let j = troopers.length - 1; j >= 0; j--) {
      const t = troopers[j];
      if (Math.abs(t.x - b.x) < 14 && Math.abs(t.y - b.y) < 16) {
        troopers.splice(j, 1);
        score += 25;
        boom(t.x, t.y, "#c8d8a0", 14, 130, 0.5);
        hit = true; break;
      }
    }
    if (!hit)
      for (let j = bombs.length - 1; j >= 0; j--) {
        const g = bombs[j];
        if (Math.abs(g.x - b.x) < 11 && Math.abs(g.y - b.y) < 13) {
          bombs.splice(j, 1); detonate(g.x, g.y, 60); score += 10; hit = true; break;
        }
      }
    if (hit) bBullets.splice(i, 1);
  }
}

function updateBoss(dt) {
  if (!boss) return;

  if (boss.dead > 0) {
    boss.dead -= dt;
    if (Math.random() < 0.5)
      boom(boss.x + (Math.random() - 0.5) * boss.w, boss.y + (Math.random() - 0.5) * boss.h,
           "#c58bff", 8, 150, 0.6);
    if (boss.dead <= 0) {
      boom(boss.x, boss.y, "#ffffff", 60, 260, 1.1);
      // its summons go with it
      for (const e of enemies) if (e.alive) { e.alive = false; boom(e.x, e.y, e.type.color, 12, 130, 0.5); }
      for (const p of phantoms) boom(p.x, p.y, "#c58bff", 12, 130, 0.5);
      for (const t of troopers) boom(t.x, t.y, "#c8d8a0", 10, 120, 0.5);
      phantoms = []; eBullets = []; grenades = []; lasers = [];
      knives = []; tridents = []; orbs = []; balls = []; walls = [];
      bombers = []; troopers = []; bombs = []; bBullets = []; blackout = 0;
      boss = null;
      shake(6, 0.3);
    }
    return;
  }

  if (boss.kind === "shark") { updateShark(dt); return; }
  if (boss.kind === "baseball") { updateHunter(dt); return; }
  if (boss.kind === "airforce") { updateCommander(dt); return; }

  boss.t += dt;
  if (boss.flash > 0) boss.flash -= dt;
  boss.frameT += dt;
  if (boss.frameT > 0.4) { boss.frameT = 0; boss.frame ^= 1; }

  boss.x += boss.vx * dt;
  if (boss.x > W - boss.w / 2 - 10) { boss.x = W - boss.w / 2 - 10; boss.vx *= -1; }
  if (boss.x < boss.w / 2 + 10) { boss.x = boss.w / 2 + 10; boss.vx *= -1; }
  boss.y = 130 + Math.sin(boss.t * 0.6) * 16;

  if (beam) return;                       // one attack at a time
  boss.cool -= dt;
  if (boss.cool > 0) return;
  boss.cool = Math.max(1.7, 3.6 - boss.tier * 0.25);
  // don't stack summons past what the screen can hold -- fall back to the beam
  const free = enemies.filter(e => e.alive && e.free).length;
  const opts = [];
  if (free < 6) opts.push(bossSummonAliens);
  if (phantoms.length < MAX_PHANTOMS) opts.push(bossSummonPhantoms);
  opts.push(bossFireBeam);
  opts[Math.floor(Math.random() * opts.length)]();
}

/* ---- phantoms: dive down, fire straight (non-homing) lasers ---- */

function updatePhantoms(dt) {
  for (let i = phantoms.length - 1; i >= 0; i--) {
    const p = phantoms[i];
    p.t += dt;
    if (p.flash > 0) p.flash -= dt;
    p.y += p.vy * dt;
    p.x += Math.sin(p.t * 2.1) * 90 * dt + Math.sign(player.x - p.x) * 26 * dt;
    p.x = Math.max(20, Math.min(W - 20, p.x));
    p.frame = (Math.floor(p.t * 8) & 1);

    if (p.y > H + 30) {                    // loop back around for another pass
      p.y = -30;
      p.x = 60 + Math.random() * (W - 120);
    }

    p.cool -= dt;
    if (p.cool <= 0 && p.y > 0 && p.y < player.y - 40 && lasers.length < 8) {
      p.cool = 1.5 + Math.random() * 1.1;
      // fired along a fixed heading with a wide spread -- never tracks the ship
      const aim = Math.atan2(player.y - p.y, player.x - p.x) + (Math.random() - 0.5) * 0.7;
      const sp = 350;
      lasers.push({ x: p.x, y: p.y + 12, vx: Math.cos(aim) * sp, vy: Math.sin(aim) * sp, t: 0 });
    }
    // phantoms are harmless to touch -- only their lasers hurt
  }
}

function updateLasers(dt) {
  for (let i = lasers.length - 1; i >= 0; i--) {
    const l = lasers[i];
    l.t += dt;
    l.x += l.vx * dt; l.y += l.vy * dt;
    if (l.x < -30 || l.x > W + 30 || l.y > H + 30 || l.y < -30) { lasers.splice(i, 1); continue; }
    if (hurtPlayerAt(l.x, l.y, 2, 4)) { lasers.splice(i, 1); killPlayer(); }
  }
}

/* ---- the ship's grenades: lobbed up, burst on contact or fuse ---- */

function updateGrenades(dt) {
  for (let i = grenades.length - 1; i >= 0; i--) {
    const g = grenades[i];
    g.fuse -= dt; g.spin += dt * 7;
    g.vy += 190 * dt;
    g.x += g.vx * dt; g.y += g.vy * dt;

    let contact = false;
    for (const e of enemies)
      if (e.alive && Math.abs(e.x - g.x) < e.type.w / 2 + 4 && Math.abs(e.y - g.y) < e.type.h / 2 + 4) { contact = true; break; }
    if (!contact && boss && !boss.dead &&
        Math.abs(boss.x - g.x) < boss.w / 2 + 4 && Math.abs(boss.y - g.y) < boss.h / 2 + 4) contact = true;
    if (!contact)
      for (const p of phantoms)
        if (Math.abs(p.x - g.x) < 18 && Math.abs(p.y - g.y) < 18) { contact = true; break; }

    if (contact || g.fuse <= 0 || g.y > H - 12 || g.y < -20) {
      grenades.splice(i, 1);
      playerBlast(g.x, Math.max(10, Math.min(g.y, H - 10)), g.power);
    }
  }
}

/* ---- boss beam ---- */

function updateBeam(dt) {
  if (!beam) return;
  beam.t += dt;
  if (beam.phase === "charge") {
    if (boss && !boss.dead) beam.x = boss.x;
    if (beam.t >= beam.charge) {
      beam.phase = "fire"; beam.t = 0;
      shake(6, 0.6);
    }
    return;
  }
  beam.x += beam.sweep * dt;
  beam.x = Math.max(40, Math.min(W - 40, beam.x));
  if (player.alive && player.inv <= 0 && Math.abs(player.x - beam.x) < beam.w / 2 + 6) killPlayer();
  if (beam.t >= beam.fireT) beam = null;
}

/* ------------------------------------------------------------------ *
 *  Render                                                            *
 * ------------------------------------------------------------------ */

function drawAlien(e) {
  const col = e.flash > 0 ? "#ffffff"
            : (e.hp < e.type.hp + (e.special ? 1 : 0)) ? e.type.hot
            : e.type.color;
  if (e.special) {
    const pulse = 0.5 + Math.sin(e.swayT * 5) * 0.5;
    ctx.save();
    ctx.globalAlpha = 0.25 + pulse * 0.3;
    ctx.strokeStyle = e.type.hot; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.type.w / 2 + 7 + pulse * 2, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  ctx.save();
  ctx.shadowColor = e.special ? e.type.hot : e.type.glow;
  ctx.shadowBlur = e.special ? 16 : 8;
  drawSprite(e.type.spr[e.frame], col, 3, e.x, e.y);
  ctx.restore();
}

function drawWater() {
  if (!boss || boss.kind !== "shark") return;
  const t = boss.t;
  ctx.save();
  for (let layer = 0; layer < 2; layer++) {
    const off = layer * 7, amp = 6 - layer * 2, spd = 1.4 + layer * 0.7;
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, WATER_Y + off);
    for (let x = 0; x <= W; x += 8)
      ctx.lineTo(x, WATER_Y + off + Math.sin(x / 46 + t * spd) * amp);
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fillStyle = layer === 0 ? "rgba(24,86,150,.55)" : "rgba(12,52,104,.75)";
    ctx.fill();
  }
  ctx.strokeStyle = "rgba(150,220,255,.55)"; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 8) {
    const y = WATER_Y + Math.sin(x / 46 + t * 1.4) * 6;
    if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.restore();
}

function drawAmbushZone() {
  if (!boss || !boss.ambush) return;
  const a = boss.ambush;
  const k = Math.min(1, a.t / a.warn);
  const pulse = 0.35 + Math.abs(Math.sin(a.t * 9)) * 0.4;
  ctx.save();
  ctx.globalAlpha = pulse * (a.leap > 0 ? 0.9 : 1);
  const g = ctx.createLinearGradient(0, 340, 0, H);
  g.addColorStop(0, "rgba(255,40,60,0)");
  g.addColorStop(1, "rgba(255,40,60,.55)");
  ctx.fillStyle = g;
  ctx.fillRect(a.x - a.w / 2, 340, a.w, H - 340);
  ctx.globalAlpha = pulse;
  ctx.strokeStyle = "#ff3b52"; ctx.lineWidth = 3;
  ctx.strokeRect(a.x - a.w / 2, 340, a.w, H - 340);
  ctx.globalAlpha = 1;
  ctx.textAlign = "center";
  ctx.fillStyle = "#ff8a95";
  ctx.font = "bold 15px 'Courier New', monospace";
  ctx.fillText("GET OUT", a.x, 372);
  ctx.fillStyle = "rgba(255,60,80," + (0.3 + k * 0.5) + ")";
  ctx.fillRect(a.x - a.w / 2, 340, a.w * k, 4);          // countdown to the leap
  ctx.restore();
}

function drawShark() {
  const col = boss.flash > 0 ? "#ffffff"
            : boss.dead > 0 ? "#ffd7d7"
            : boss.phase === 2 ? "#8fd4ff" : "#9fb4c8";
  if (boss.sub && !(boss.ambush && boss.ambush.leap > 0)) {
    // only the fin shows above the surface
    const fy = WATER_Y + Math.sin(boss.finX / 46 + boss.t * 1.4) * 6;
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.shadowColor = "#0a3050"; ctx.shadowBlur = 12;
    drawSprite(SPR.shark[boss.frame], "#123c60", 3, boss.finX, fy + 34);
    ctx.restore();
    ctx.save();
    ctx.shadowColor = "#7fd4ff"; ctx.shadowBlur = 14;
    drawSprite(SPR.fin[0], col, 3, boss.finX, fy - 10);
    ctx.restore();
    return;
  }
  ctx.save();
  ctx.shadowColor = boss.phase === 2 ? "#2f8fd6" : "#33506b";
  ctx.shadowBlur = 18;
  if (boss.dead > 0) ctx.globalAlpha = 0.4 + Math.random() * 0.6;
  ctx.translate(boss.x, boss.y);
  ctx.scale(boss.facing || 1, 1);
  drawSprite(SPR.shark[boss.frame], col, 4, 0, 0);
  ctx.restore();

  // eye
  ctx.save();
  ctx.globalAlpha = 0.8;
  ctx.fillStyle = boss.phase === 2 ? "#8ff0ff" : "#ff5566";
  ctx.beginPath();
  ctx.arc(boss.x - (boss.facing || 1) * 34, boss.y - 6, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawBaseball(x, y, r, spin, style) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(spin);
  ctx.shadowColor = style === "deflected" ? "#ffd84d" : style === "track" ? "#ff6b72" : "#c8d6e4";
  ctx.shadowBlur = style === "plain" ? 8 : 16;
  ctx.fillStyle = style === "deflected" ? "#fff0b0" : "#f4f8fb";
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = style === "deflected" ? "#c08a10" : "#d8404a";   // stitching
  ctx.lineWidth = Math.max(1.5, r / 5);
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(s * r * 0.85, 0, r * 0.95, -0.9, 0.9);
    ctx.stroke();
  }
  ctx.restore();
}

function drawWalls() {
  for (const w of walls) {
    const arming = w.t < w.warn;
    ctx.save();
    if (arming) {
      const k = w.t / w.warn;
      ctx.globalAlpha = 0.3 + Math.abs(Math.sin(w.t * 9)) * 0.5;
      ctx.strokeStyle = "#ff5566"; ctx.lineWidth = 2;
      ctx.setLineDash([12, 8]);
      ctx.beginPath(); ctx.moveTo(0, w.y); ctx.lineTo(W, w.y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 0.8;
      ctx.strokeStyle = "#7dffb2"; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(w.gapX - w.gapW / 2, w.y); ctx.lineTo(w.gapX + w.gapW / 2, w.y);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.textAlign = "center";
      ctx.fillStyle = "#7dffb2";
      ctx.font = "bold 13px 'Courier New', monospace";
      ctx.fillText("GAP", w.gapX, w.y - 12);
      ctx.globalAlpha = 0.35 + k * 0.4;
      ctx.restore();
      continue;
    }
    ctx.restore();
    for (let x = 14; x < W; x += 27) {
      if (Math.abs(x - w.gapX) < w.gapW / 2) continue;
      drawBaseball(x, w.y, 11, w.y / 40 + x, "plain");
    }
  }
}

function drawHunter() {
  const col = boss.flash > 0 ? "#ffffff"
            : boss.dead > 0 ? "#ffd7d7"
            : boss.phase === 3 ? "#ff9a5a" : boss.phase === 2 ? "#ffd06a" : "#b9c8d8";
  // the bat, swung on the tracking shot
  const sw = boss.swing > 0 ? (1 - boss.swing / 0.45) : 1;
  ctx.save();
  ctx.translate(boss.x + 44, boss.y - 6);
  ctx.rotate(-1.1 + sw * 2.2);
  ctx.shadowColor = "#8a5a2a"; ctx.shadowBlur = 10;
  ctx.fillStyle = "#c98a4a";
  ctx.fillRect(-5, -46, 10, 46);
  ctx.fillStyle = "#8a5a2a";
  ctx.fillRect(-4, -4, 8, 16);
  ctx.restore();

  ctx.save();
  ctx.shadowColor = boss.phase === 3 ? "#ff6a2a" : "#4a6a8a";
  ctx.shadowBlur = 18;
  if (boss.dead > 0) ctx.globalAlpha = 0.4 + Math.random() * 0.6;
  drawSprite(SPR.hunter[boss.frame], col, 4, boss.x, boss.y);
  ctx.restore();

  ctx.save();                                  // visor
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = boss.phase === 3 ? "#ffd06a" : "#ff5566";
  ctx.fillRect(boss.x - 22, boss.y - 20, 44, 6);
  ctx.restore();
}

function drawCommander() {
  const col = boss.flash > 0 ? "#ffffff"
            : boss.dead > 0 ? "#ffd7d7"
            : boss.phase === 3 ? "#ff8a72" : boss.phase === 2 ? "#e0c98a" : "#b8c8d8";
  ctx.save();
  ctx.shadowColor = boss.phase === 3 ? "#ff5566" : "#4a6a8a";
  ctx.shadowBlur = 18;
  if (boss.dead > 0) ctx.globalAlpha = 0.4 + Math.random() * 0.6;
  ctx.translate(boss.x, boss.y);
  ctx.scale(boss.facing || 1, 1);
  drawSprite(SPR.plane[boss.frame], col, 4, 0, 0);
  ctx.restore();
  // engine wash
  ctx.save();
  ctx.globalAlpha = 0.5 + Math.random() * 0.3;
  ctx.fillStyle = "#ffb347";
  ctx.fillRect(boss.x - (boss.facing || 1) * 58, boss.y - 3, 12, 6);
  ctx.restore();
}

function drawBombers() {
  for (const b of bombers) {
    ctx.save();
    ctx.shadowColor = "#8a4a05"; ctx.shadowBlur = 12;
    ctx.translate(b.x, b.y);
    ctx.scale(b.dir, 1);
    drawSprite(SPR.bomber[b.frame], b.flash > 0 ? "#ffffff" : "#ff9a2e", 3, 0, 0);
    ctx.restore();
  }
}

function drawBombs() {
  for (const g of bombs) {
    ctx.save();
    ctx.shadowColor = "#ff5a2e"; ctx.shadowBlur = 10;
    ctx.fillStyle = "#3b3b2b";
    ctx.beginPath(); ctx.ellipse(g.x, g.y, 6, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#8a8a6a";
    ctx.fillRect(g.x - 4, g.y + 6, 8, 4);
    ctx.restore();
  }
}

function drawTroopers() {
  for (const t of troopers) {
    if (t.state === "fall") {                    // canopy and rigging
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = "#d8e2ea";
      ctx.beginPath();
      ctx.arc(t.x, t.y - 26, 17, Math.PI, 0);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "#9fb0c0"; ctx.lineWidth = 1;
      for (const dx of [-15, 0, 15]) {
        ctx.beginPath(); ctx.moveTo(t.x + dx, t.y - 26); ctx.lineTo(t.x, t.y - 8); ctx.stroke();
      }
      ctx.restore();
    }
    ctx.save();
    ctx.shadowColor = "#4a5a2a"; ctx.shadowBlur = 8;
    drawSprite(SPR.trooper[0], t.state === "land" ? "#b6c88a" : "#c8d8a0", 3, t.x, t.y);
    ctx.restore();
    if (t.swing > 0) {                           // sword slash
      ctx.save();
      ctx.globalAlpha = 0.6 + Math.random() * 0.4;
      ctx.strokeStyle = "#eaf4ff"; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(t.x + 5, t.y - 2);
      ctx.lineTo(t.x + 7, t.y - 15);
      ctx.stroke();
      ctx.restore();
    }
  }
}

function drawBoss() {
  if (!boss) return;
  if (boss.kind === "shark") { drawShark(); drawBossBar(); return; }
  if (boss.kind === "airforce") { drawCommander(); drawBossBar(); return; }
  if (boss.kind === "baseball") { drawHunter(); drawBossBar(); return; }
  const col = boss.flash > 0 ? "#ffffff" : (boss.dead > 0 ? "#ffd0ff" : "#b98bff");
  ctx.save();
  ctx.shadowColor = "#7a2bd6"; ctx.shadowBlur = 22;
  if (boss.dead > 0) ctx.globalAlpha = 0.4 + Math.random() * 0.6;
  drawSprite(SPR.boss[boss.frame], col, 4, boss.x, boss.y);
  ctx.restore();

  // eye glow
  ctx.save();
  ctx.globalAlpha = 0.34 + Math.sin(boss.t * 6) * 0.16;
  const g = ctx.createRadialGradient(boss.x, boss.y - 2, 2, boss.x, boss.y - 2, 20);
  g.addColorStop(0, "#ffffff"); g.addColorStop(0.4, "#c58bff"); g.addColorStop(1, "rgba(120,40,220,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(boss.x, boss.y - 2, 20, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  drawBossBar();
}

function drawBossBar() {
  if (!boss || boss.dead > 0) return;
  const shark = boss.kind === "shark", ball = boss.kind === "baseball";
  const air = boss.kind === "airforce";
  const phased = shark || ball || air;
  const bw = 380, bx = (W - bw) / 2, by = 74;
  ctx.fillStyle = "rgba(20,10,40,.8)"; ctx.fillRect(bx - 2, by - 2, bw + 4, 14);
  ctx.fillStyle = shark ? "#123c60" : ball ? "#4a3a12" : air ? "#2a3a4a" : "#3a1a5e";
  ctx.fillRect(bx, by, bw, 10);
  const frac = Math.max(0, boss.hp / boss.maxHp);
  ctx.fillStyle = frac > 0.35 ? (shark ? "#7fd4ff" : ball ? "#ffd06a" : air ? "#b8c8d8" : "#c58bff") : "#ff5d7a";
  ctx.fillRect(bx, by, bw * frac, 10);
  if (shark) {   // halfway mark: where phase 2 begins
    ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.fillRect(bx + bw / 2 - 1, by - 2, 2, 14);
  }
  if (ball || air) {    // thirds: the two phase changes
    ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.fillRect(bx + bw / 3 - 1, by - 2, 2, 14);
    ctx.fillRect(bx + bw * 2 / 3 - 1, by - 2, 2, 14);
  }
  ctx.textAlign = "center";
  ctx.font = "bold 13px 'Courier New', monospace";
  ctx.fillStyle = shark ? "#bfe8ff" : ball ? "#ffe6b0" : air ? "#d8e6f2" : "#e0c6ff";
  ctx.fillText(BOSS_NAME[boss.kind] +
               (phased ? "   PHASE " + boss.phase : "") +
               (boss.tier > 1 ? "  TIER " + boss.tier : ""), W / 2, by - 8);
  if (shark && boss.sub && !boss.ambush) {
    ctx.fillStyle = "#7fd4ff";
    ctx.font = "12px 'Courier New', monospace";
    ctx.fillText("SUBMERGED - UNTOUCHABLE - SURFACES IN " + Math.max(0, boss.subT).toFixed(1) + "s", W / 2, by + 26);
  }
}

function drawPhantoms() {
  for (const p of phantoms) {
    ctx.save();
    ctx.globalAlpha = 0.55 + Math.sin(p.t * 5) * 0.15;
    ctx.shadowColor = "#8a3fd6"; ctx.shadowBlur = 14;
    drawSprite(SPR.phantom[p.frame], p.flash > 0 ? "#ffffff" : "#c58bff", 3, p.x, p.y);
    ctx.restore();
  }
}

function drawBeam() {
  if (!beam) return;
  if (beam.phase === "charge") {
    const k = beam.t / beam.charge;
    ctx.save();
    ctx.globalAlpha = 0.25 + k * 0.5;
    ctx.strokeStyle = "#ff7ad0"; ctx.lineWidth = 2 + k * 4;
    ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.moveTo(beam.x, boss ? boss.y : 130); ctx.lineTo(beam.x, H); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 0.5 + k * 0.5;
    const g = ctx.createRadialGradient(beam.x, boss ? boss.y : 130, 2, beam.x, boss ? boss.y : 130, 10 + k * 30);
    g.addColorStop(0, "#ffffff"); g.addColorStop(0.5, "#ff7ad0"); g.addColorStop(1, "rgba(255,60,180,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(beam.x, boss ? boss.y : 130, 10 + k * 30, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    return;
  }
  const top = boss ? boss.y : 130;
  const flick = 0.85 + Math.random() * 0.15;
  ctx.save();
  ctx.globalAlpha = flick;
  const g = ctx.createLinearGradient(beam.x - beam.w / 2, 0, beam.x + beam.w / 2, 0);
  g.addColorStop(0, "rgba(190,60,255,0)");
  g.addColorStop(0.2, "rgba(200,90,255,.75)");
  g.addColorStop(0.5, "rgba(255,255,255,.95)");
  g.addColorStop(0.8, "rgba(200,90,255,.75)");
  g.addColorStop(1, "rgba(190,60,255,0)");
  ctx.fillStyle = g;
  ctx.fillRect(beam.x - beam.w / 2, top, beam.w, H - top);
  ctx.globalAlpha = flick * 0.9;
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(beam.x - 7, top, 14, H - top);
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = "#7fa6d8";
  ctx.font = "bold 16px 'Courier New', monospace";
  ctx.textAlign = "left";
  ctx.fillText("SCORE " + String(score).padStart(5, "0"), 16, 26);
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffe14d";
  ctx.fillText("HI " + String(hiScore).padStart(5, "0"), W / 2, 26);
  ctx.textAlign = "right";
  ctx.fillStyle = isBossWave(wave) ? "#c58bff" : "#7fa6d8";
  ctx.fillText("WAVE " + wave + (isBossWave(wave) ? "  BOSS" : ""), W - 16, 26);

  for (let i = 0; i < lives; i++)
    drawSprite(SPR.player[0], "#7dffb2", 2, 30 + i * 34, 46);

  ctx.textAlign = "right";
  ctx.fillStyle = "#3d5578";
  ctx.font = "12px 'Courier New', monospace";
  ctx.fillText("[P] PAUSE    [`] ADMIN", W - 16, 48);

  ctx.textAlign = "left";
  ctx.font = "bold 13px 'Courier New', monospace";
  let hy = 66;
  if (admin.immortal) { ctx.fillStyle = "#66ffd5"; ctx.fillText("SHIELD ACTIVE", 16, hy); hy += 17; }
  if (player.nades > 0) {
    ctx.fillStyle = "#ff9a5a";
    ctx.fillText("GRENADES " + player.nades + "  [F]", 16, hy); hy += 17;
  }
  if (player.rapidT > 0) {
    ctx.fillStyle = "#ffe14d";
    ctx.fillText("RAPID FIRE " + player.rapidT.toFixed(1) + "s", 16, hy);
  }
}

function panel(title, lines, sub) {
  ctx.fillStyle = "rgba(3,6,16,.82)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = "#cfe8ff";
  ctx.font = "bold 44px 'Courier New', monospace";
  ctx.fillText(title, W / 2, 150);
  ctx.font = "16px 'Courier New', monospace";
  let y = 210;
  for (const l of lines) {
    ctx.fillStyle = l.color || "#9fc4ea";
    ctx.fillText(l.text !== undefined ? l.text : l, W / 2, y);
    y += l.gap || 26;
  }
  if (sub) {
    ctx.fillStyle = (Math.floor(performance.now() / 400) % 2) ? "#ffe14d" : "#7a6b1f";
    ctx.font = "bold 18px 'Courier New', monospace";
    ctx.fillText(sub, W / 2, H - 70);
  }
}

function drawAdmin() {
  ctx.fillStyle = "rgba(2,4,12,.93)";
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "#2a6f8f"; ctx.lineWidth = 2;
  ctx.strokeRect(60, 74, W - 120, H - 130);

  ctx.textAlign = "center";
  ctx.fillStyle = "#66ffd5";
  ctx.font = "bold 30px 'Courier New', monospace";
  ctx.fillText("ADMIN PANEL", W / 2, 118);
  ctx.font = "12px 'Courier New', monospace";
  ctx.fillStyle = "#4f7f96";
  ctx.fillText("up/down select    left/right adjust    enter or click activate    ` or esc close", W / 2, 144);

  ctx.font = "bold 15px 'Courier New', monospace";
  for (let i = 0; i < ADMIN_ROWS.length; i++) {
    const y = adminRowY(i), on = i === admin.sel;
    if (on) {
      ctx.fillStyle = "rgba(102,255,213,.10)";
      ctx.fillRect(90, y - 16, W - 180, 25);
      ctx.fillStyle = "#66ffd5";
      ctx.textAlign = "left";
      ctx.fillText(">", 100, y);
    }
    ctx.textAlign = "left";
    ctx.fillStyle = on ? "#d7fff5" : "#7fa6d8";
    ctx.fillText(ADMIN_ROWS[i].label(), 124, y);
  }

  ctx.textAlign = "center";
  ctx.font = "13px 'Courier New', monospace";
  ctx.fillStyle = "#4f7f96";
  ctx.fillText(ADMIN_ROWS[admin.sel].hint, W / 2, H - 74);
  ctx.fillStyle = "#8a6a2a";
  ctx.font = "12px 'Courier New', monospace";
  ctx.fillText("using the panel keeps this run out of the high score", W / 2, H - 40);
}

function drawTitle() {
  ctx.textAlign = "center";
  ctx.fillStyle = "#cfe8ff";
  ctx.font = "bold 50px 'Courier New', monospace";
  ctx.fillText("SPACE INVADERS", W / 2, 96);

  const order = ["blue", "orange", "red", "yellow"];
  let y = 168;
  ctx.font = "15px 'Courier New', monospace";
  for (const k of order) {
    const t = TYPES[k];
    drawSprite(t.spr[0], t.color, 2, W / 2 - 200, y - 5);
    ctx.textAlign = "left";
    ctx.fillStyle = t.color;
    ctx.fillText(k.toUpperCase(), W / 2 - 168, y);
    ctx.fillStyle = "#7fa6d8";
    ctx.fillText(t.desc, W / 2 - 82, y);
    ctx.textAlign = "right";
    ctx.fillStyle = "#5f7ea6";
    ctx.fillText(t.points + " pts", W / 2 + 200, y);
    y += 34;
  }

  ctx.textAlign = "center";
  ctx.fillStyle = "#ffb0b4";
  ctx.font = "14px 'Courier New', monospace";
  ctx.fillText("SPECIAL red / orange / yellow aliens glow, take an extra hit and rip off bursts", W / 2, y + 8);
  ctx.fillStyle = "#ffd9a0";
  ctx.fillText("kill one and it drops a BOOSTER - [G] 2 grenades   [R] rapid fire", W / 2, y + 28);

  const bosses = [
    { spr: SPR.boss[0],   col: "#b98bff", sub: "#8f7fc8", w: "WAVE 5",
      name: "VOID SWEEPER",   desc: "phantoms, laser" },
    { spr: SPR.shark[0],  col: "#8fd4ff", sub: "#6f9fc8", w: "WAVE 10",
      name: "KNIFE SHARK",   desc: "knives, ambush" },
    { spr: SPR.hunter[0], col: "#ffd06a", sub: "#c8a05a", w: "WAVE 15",
      name: "BASEBALL HUNTER", desc: "cascades, walls" },
    { spr: SPR.plane[0],  col: "#b8c8d8", sub: "#8fa0b0", w: "WAVE 20",
      name: "AIR FORCE CMDR", desc: "bombers, troopers" }
  ];
  for (let i = 0; i < bosses.length; i++) {
    const b = bosses[i], bx = 100 + i * 200;
    drawSprite(b.spr, b.col, 2, bx, y + 60);
    ctx.fillStyle = b.col;
    ctx.font = "bold 12px 'Courier New', monospace";
    ctx.fillText(b.w, bx, y + 86);
    ctx.fillText(b.name, bx, y + 100);
    ctx.font = "10px 'Courier New', monospace";
    ctx.fillStyle = b.sub;
    ctx.fillText(b.desc, bx, y + 114);
  }

  ctx.fillStyle = "#7fa6d8";
  ctx.font = "15px 'Courier New', monospace";
  ctx.font = "14px 'Courier New', monospace";
  ctx.fillText("WASD / ARROWS  move    SPACE  shoot    B  shoot backward    F  grenade    P  pause",
               W / 2, y + 152);
  ctx.fillStyle = "#66ffd5";
  ctx.font = "13px 'Courier New', monospace";
  ctx.fillText("[ ` ]  ADMIN PANEL  -  skip waves, immortality, specials, boosters", W / 2, y + 174);

  ctx.fillStyle = (Math.floor(performance.now() / 400) % 2) ? "#ffe14d" : "#7a6b1f";
  ctx.font = "bold 20px 'Courier New', monospace";
  ctx.fillText("PRESS SPACE TO START", W / 2, H - 40);
}

function render() {
  ctx.save();
  if (shakeT > 0) {
    const k = shakeAmp;
    ctx.translate((Math.random() - 0.5) * k, (Math.random() - 0.5) * k);
  }

  ctx.fillStyle = "#05060d";
  ctx.fillRect(-20, -20, W + 40, H + 40);
  for (const s of stars) {
    ctx.fillStyle = "rgba(150,190,255," + (0.15 + s.s * 0.32) + ")";
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }

  if (state === "title") {
    drawTitle();
    ctx.restore();
    return;
  }

  ctx.fillStyle = "#1e5c38";
  ctx.fillRect(0, 626, W, 2);

  drawWater();
  drawAmbushZone();
  for (const e of enemies) if (e.alive) drawAlien(e);
  drawPhantoms();
  drawBoss();
  drawBeam();

  for (const b of bullets) {
    ctx.fillStyle = "#eaffef";
    ctx.fillRect(b.x - 1.5, b.y - 10, 3, 12);
    ctx.fillStyle = "rgba(125,255,178,.45)";
    ctx.fillRect(b.x - 1, b.y + 2, 2, 8);
  }

  for (const b of eBullets) {
    if (b.kind === "fire") {
      const pulse = 6 + Math.sin(b.t * 22) * 1.6;
      ctx.save();
      ctx.shadowColor = "#ff8a1e"; ctx.shadowBlur = 18;
      const g = ctx.createRadialGradient(b.x, b.y, 1, b.x, b.y, pulse + 4);
      g.addColorStop(0, "#fff6c9"); g.addColorStop(0.45, "#ffab2e"); g.addColorStop(1, "rgba(255,80,0,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x, b.y, pulse + 4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.fillStyle = "rgba(255,140,40,.5)";
      ctx.fillRect(b.x - 2, b.y - 16, 4, 12);
    } else if (b.kind === "rapid") {
      ctx.fillStyle = b.col || "#ffe14d";
      ctx.fillRect(b.x - 1.5, b.y - 5, 3, 10);
    } else if (b.kind === "boom") {
      ctx.save();
      ctx.shadowColor = "#ff2a3a"; ctx.shadowBlur = 12;
      ctx.fillStyle = "#ff4a52";
      ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffd0d2";
      ctx.beginPath(); ctx.arc(b.x, b.y, 2, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else if (b.kind === "heavy") {
      ctx.fillStyle = "#ff6b72";
      ctx.fillRect(b.x - 3, b.y - 7, 6, 14);
      ctx.fillStyle = "#ffd0d2";
      ctx.fillRect(b.x - 1, b.y - 5, 2, 10);
    } else {
      ctx.fillStyle = "#9ed0ff";
      ctx.fillRect(b.x - 1.5, b.y - 6, 3, 11);
    }
  }

  // phantom lasers: straight bolts, no tracking once fired
  for (const l of lasers) {
    const d = Math.hypot(l.vx, l.vy) || 1;
    const ux = l.vx / d, uy = l.vy / d;
    ctx.save();
    ctx.shadowColor = "#ff4fd8"; ctx.shadowBlur = 10;
    ctx.strokeStyle = "#ff9af0"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x - ux * 20, l.y - uy * 20); ctx.stroke();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x - ux * 16, l.y - uy * 16); ctx.stroke();
    ctx.restore();
  }

  drawBombers();
  drawBombs();
  drawTroopers();
  for (const b of bBullets) {
    ctx.fillStyle = "#eaffef";
    ctx.fillRect(b.x - 1.5, b.y - 2, 3, 12);
    ctx.fillStyle = "rgba(125,255,178,.45)";
    ctx.fillRect(b.x - 1, b.y - 10, 2, 8);
  }

  drawWalls();
  for (const b of balls)
    drawBaseball(b.x, b.y, b.r, b.spin,
                 b.deflected ? "deflected" : b.track ? "track" : "plain");

  // knives -- gold once deflected, and then they hunt the shark instead
  for (const k of knives) {
    ctx.save();
    ctx.translate(k.x, k.y);
    ctx.rotate(k.ang + Math.PI / 2);
    ctx.shadowColor = k.deflected ? "#ffd84d" : "#ff5566";
    ctx.shadowBlur = 12;
    ctx.fillStyle = k.deflected ? "#7a5a10" : "#4a3b3b";      // handle
    ctx.fillRect(-3, 6, 6, 14);
    ctx.fillStyle = k.deflected ? "#ffd84d" : "#d8e2ea";      // guard
    ctx.fillRect(-8, 2, 16, 4);
    ctx.beginPath();                                          // blade
    ctx.moveTo(0, -22); ctx.lineTo(6, 2); ctx.lineTo(-6, 2);
    ctx.closePath();
    ctx.fillStyle = k.deflected ? "#fff0b0" : "#eef5fb";
    ctx.fill();
    ctx.restore();
  }
